<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SP미디어텍</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script>
// 페이지 로드 즉시 실행 — 깜빡임 & 보안 버그 방지
(function(){
  const p = new URLSearchParams(location.search);
  const mode = p.get('mode');
  if (mode === 'publisher' || mode === 'engineer') {
    // 모드 선택 화면 즉시 숨기는 스타일 주입
    document.write('<style id="pre-hide">#mode-screen{display:none!important}</style>');
  }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:#0d0d0d;color:#e8e6df;min-height:100vh}

/* 모드 선택 */
.mode-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;gap:32px}
.logo-area{text-align:center}
.logo-area h1{font-size:22px;font-weight:700;letter-spacing:-0.5px;margin-bottom:6px}
.logo-area p{font-size:13px;color:#666}
.mode-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:100%;max-width:380px}
.mode-card{background:#161616;border:0.5px solid #2a2a2a;border-radius:16px;padding:28px 16px;text-align:center;cursor:pointer;transition:all 0.2s}
.mode-card:hover{border-color:#555;background:#1c1c1c;transform:translateY(-3px)}
.mode-card .icon{font-size:32px;margin-bottom:12px}
.mode-card .title{font-size:14px;font-weight:700;margin-bottom:6px}
.mode-card .desc{font-size:11px;color:#666;line-height:1.6;word-break:keep-all}

/* 앱 공통 */
.app{display:none;flex-direction:column;min-height:100vh}
.app.active{display:flex}
.topbar{background:#111;border-bottom:0.5px solid #1e1e1e;padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-brand{font-size:13px;font-weight:700}
.topbar-sub{font-size:11px;color:#555;padding:3px 8px;background:#1a1a1a;border-radius:20px}
.topbar-right{display:flex;align-items:center;gap:8px}
.tbtn{font-size:11px;padding:5px 12px;border-radius:6px;border:0.5px solid #2a2a2a;background:#161616;color:#888;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.tbtn:hover{border-color:#444;color:#ccc}
.tbtn.primary{background:#e8e6df;color:#111;border-color:#e8e6df;font-weight:700}
.content{flex:1;padding:20px;max-width:1000px;margin:0 auto;width:100%}

/* 요약 */
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.scard{background:#161616;border:0.5px solid #1e1e1e;border-radius:12px;padding:16px}
.scard .lbl{font-size:11px;color:#555;margin-bottom:8px}
.scard .val{font-size:26px;font-weight:700;line-height:1}
.scard .val-sub{font-size:11px;color:#555;margin-top:4px}
.v-default{color:#e8e6df}.v-red{color:#f87171}.v-amber{color:#fbbf24}.v-green{color:#4ade80}

/* 필터 */
.filter-bar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar .lbl{font-size:12px;color:#555;margin-right:4px}
.fchip{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid #2a2a2a;background:#161616;color:#666;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.fchip:hover{border-color:#444;color:#aaa}
.fchip.on{background:#e8e6df;color:#111;border-color:#e8e6df;font-weight:500}

/* 프로젝트 카드 */
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{background:#161616;border:0.5px solid #1e1e1e;border-radius:14px;overflow:hidden;transition:border-color 0.15s;cursor:pointer}
.pcard:hover{border-color:#333}
.pcard.urgent{border-left:3px solid #f87171}
.pcard.warn{border-left:3px solid #fbbf24}
.pcard.ok{border-left:3px solid #4ade80}
.pcard.done-card{border-left:3px solid #3a3a3a;opacity:0.7}

/* 카드 헤더 */
.card-head{padding:14px 16px;display:flex;align-items:center;gap:12px}
.card-head-left{flex:1;min-width:0}
.card-title-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.pub-name{font-size:16px;font-weight:700;color:#fff}
.book-name{font-size:14px;color:#e2e8f0;font-weight:400}
.card-meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.stage-text{font-size:14px;color:#ccc;font-weight:600}
.stage-summary{font-size:12px;color:#aaa;padding:2px 8px;background:#1e1e1e;border-radius:4px}
.card-head-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}

/* 진행 바 */
.prog-wrap{padding:0 16px 14px;display:flex;align-items:center;gap:10px}
.prog-bar{flex:1;height:4px;background:#1e1e1e;border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#3B8BD4,#4ade80);transition:width 0.4s}
.prog-pct{font-size:11px;color:#555;min-width:32px;text-align:right}

/* 칩 */
.chip{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chip-red{background:#2d1515;color:#f87171}
.chip-amber{background:#2d2010;color:#fbbf24}
.chip-green{background:#0f2d1a;color:#4ade80}
.chip-blue{background:#0f1f2d;color:#60a5fa}
.chip-purple{background:#1f1030;color:#c084fc}
.chip-gray{background:#1e1e1e;color:#666}
.dday-chip{font-size:11px;font-weight:600;padding:4px 10px;border-radius:8px}

/* 상세 펼침 */
.card-detail{display:none;border-top:0.5px solid #1e1e1e;padding:16px}
.card-detail.open{display:block}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.detail-section{background:#111;border-radius:10px;padding:14px}
.detail-section.full{grid-column:1/-1}
.ds-title{font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ds-title .cnt{font-size:10px;padding:2px 7px;border-radius:20px}

/* 체크리스트 */
.check-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid #1a1a1a;font-size:12px}
.check-item:last-child{border-bottom:none}
.check-item input{accent-color:#4ade80;width:14px;height:14px;cursor:pointer;flex-shrink:0}
.check-item .ci-text{flex:1;line-height:1.8;font-size:14px;color:#e2e8f0}
.check-item .ci-text.done{text-decoration:line-through;color:#666}
.ci-due{font-size:10px;padding:2px 7px;border-radius:6px;flex-shrink:0}

/* 단계 버튼 */
.step-grid{display:flex;gap:5px;flex-wrap:wrap}
.sbtn{font-size:11px;padding:5px 10px;border-radius:6px;border:0.5px solid #2a2a2a;background:#1a1a1a;color:#666;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.sbtn:hover{border-color:#444;color:#aaa}
.sbtn.s-done{background:#0f2d1a;color:#4ade80;border-color:#1a4a2a}
.sbtn.s-ing{background:#0f1f2d;color:#60a5fa;border-color:#1a3a4a}

/* 단계 타임라인 */
.timeline{display:flex;flex-direction:column;gap:6px}
.tl-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:12px}
.tl-item.tl-done{background:#0f2d1a}
.tl-item.tl-ing{background:#0f1f2d}
.tl-item.tl-wait{background:#1a1a1a}
.tl-num{font-size:11px;font-weight:700;width:20px;text-align:center;flex-shrink:0}
.tl-name{flex:1;font-size:14px;color:#ddd}
.tl-due{font-size:10px;color:#555}
.tl-status{font-size:10px;padding:2px 7px;border-radius:6px;flex-shrink:0}
.ts-done{background:#0f2d1a;color:#4ade80}
.ts-ing{background:#0f1f2d;color:#60a5fa}
.ts-wait{background:#1e1e1e;color:#555}

/* 연락처 안내 */
.contact-box{background:#111;border:0.5px solid #1e1e1e;border-radius:10px;padding:14px;margin-top:12px}
.contact-box .ct-title{font-size:12px;font-weight:700;margin-bottom:10px;color:#aaa}
.contact-row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:0.5px solid #1a1a1a;font-size:12px}
.contact-row:last-child{border-bottom:none}
.ct-label{color:#555;min-width:80px;flex-shrink:0}
.ct-val{color:#aaa;line-height:1.5}
.link-btn{display:block;padding:10px 14px;border-radius:8px;background:#0f1f2d;color:#60a5fa;border:0.5px solid #1a3a4a;font-size:12px;font-weight:500;text-align:center;cursor:pointer;font-family:'Noto Sans KR',sans-serif;text-decoration:none;transition:all 0.15s;margin-top:8px}
.link-btn:hover{background:#152a3d}
.action-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.abtn{font-size:11px;padding:6px 12px;border-radius:6px;border:0.5px solid #2a2a2a;background:#1a1a1a;color:#888;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all 0.15s}
.abtn:hover{border-color:#444;color:#ccc}

/* 출판사/엔지니어 뷰 */
.pub-hero{background:#161616;border:0.5px solid #1e1e1e;border-radius:16px;padding:24px;margin-bottom:16px;text-align:center}
.pub-hero h2{font-size:20px;font-weight:700;margin-bottom:4px}
.pub-hero .book{font-size:14px;color:#666;margin-bottom:16px}
.stage-badge{display:inline-flex;align-items:center;gap:8px;background:#0f1f2d;color:#60a5fa;border:0.5px solid #1a3a4a;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:500}
.action-card{background:#161616;border:0.5px solid #1e1e1e;border-radius:14px;padding:16px;margin-bottom:12px}
.ac-title{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.pub-project-select{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.psel-card{background:#161616;border:0.5px solid #1e1e1e;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;justify-content:space-between}
.psel-card:hover{border-color:#444}

/* 알림 */
.toast{position:fixed;bottom:24px;right:24px;background:#4ade80;color:#0d0d0d;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:700;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:100}
.toast.show{opacity:1}
.empty{text-align:center;padding:60px 20px;color:#444;font-size:13px}

/* 상세설명 팝오버 */
.detail-popup{display:none;position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:20px}
.detail-popup.open{display:flex}
.dp-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.7)}
.dp-box{position:relative;background:#1a1a1a;border:0.5px solid #333;border-radius:16px;padding:24px;max-width:460px;width:100%;z-index:1;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.dp-tag{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.dp-title{font-size:17px;font-weight:700;margin-bottom:6px;line-height:1.4}
.dp-how{font-size:12px;color:#60a5fa;background:#0f1f2d;border-radius:8px;padding:10px 12px;margin-bottom:12px}
.dp-desc{font-size:13px;color:#aaa;line-height:1.8;white-space:pre-wrap}
.dp-close{position:absolute;top:16px;right:16px;background:#2a2a2a;border:none;color:#888;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
.dp-close:hover{background:#333;color:#fff}
.info-btn{display:none} /* ⓘ 버튼 숨김 */
.tl-name{cursor:pointer;transition:color 0.15s}
.tl-name:hover{color:#60a5fa;text-decoration:underline dotted}
.ci-text{cursor:pointer;transition:color 0.15s}
.ci-text:hover{color:#60a5fa;text-decoration:underline dotted}

/* ── 모바일 반응형 ── */
@media (max-width: 768px) {
  .detail-grid{grid-template-columns:1fr !important;gap:12px}
  .summary-grid{grid-template-columns:repeat(2,1fr) !important}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .topbar-brand{font-size:14px}
  .topbar-sub{font-size:11px}
  .tbtn{font-size:11px;padding:6px 10px}

  /* 단계 박스 - 가로로 펼치기 */
  .tl-item{display:flex !important;align-items:center !important;flex-direction:row !important;padding:10px 12px !important;gap:10px !important}
  .tl-num{flex-shrink:0;width:24px}
  .tl-name{flex:1;min-width:0;word-break:keep-all;font-size:13px;line-height:1.4;text-align:left;white-space:normal}
  .tl-status{flex-shrink:0;font-size:11px;white-space:nowrap}

  /* 체크리스트 - 가로 펼치고 D-day는 줄 바꿈 허용 */
  .check-item{flex-wrap:wrap;align-items:flex-start;padding:10px 0}
  .check-item .ci-text{font-size:13px;line-height:1.4;word-break:keep-all;min-width:0;flex:1 1 70%}
  .ci-due{flex-shrink:0;font-size:10px;margin-top:2px}

  /* SP 내부 마감일 행도 가로 */
  .detail-section > div[style*="display:flex"]{flex-wrap:wrap}

  /* 폰트/패딩 축소 */
  .summary-card{padding:12px}
  .summary-card .lbl{font-size:10px}
  .summary-card .val{font-size:18px}
  .detail-section{padding:12px}
  .ds-title{font-size:10px}
  .card-head{padding:12px}
  .card-title{font-size:14px}

  /* 팝업 모바일 대응 */
  .detail-popup{max-width:92vw !important;max-height:85vh}
  .dp-desc{font-size:12px;line-height:1.7}
}
</style>
</head>
<body>

<div class="mode-screen" id="mode-screen">
  <div class="logo-area">
    <h1>SP미디어텍</h1>
    <p>오디오북 제작 진행 현황</p>
  </div>
  <div id="entry-box" style="width:100%;max-width:320px;background:#161616;border:0.5px solid #2a2a2a;border-radius:16px;padding:28px 24px;text-align:center">
    <div style="font-size:13px;color:#888;margin-bottom:18px">내부 관리자 비밀번호를 입력해주세요</div>
    <input type="password" id="entry-pw" placeholder="비밀번호"
      style="width:100%;background:#0d0d0d;border:0.5px solid #2a2a2a;border-radius:10px;padding:11px 16px;color:#e8e6df;font-size:14px;font-family:inherit;outline:none;text-align:center;letter-spacing:3px;margin-bottom:10px"
      onkeydown="if(event.key==='Enter')entrySubmit()">
    <div id="entry-err" style="font-size:11px;color:#f87171;margin-bottom:10px;display:none">비밀번호가 올바르지 않습니다</div>
    <button onclick="entrySubmit()" style="width:100%;padding:11px;border-radius:10px;border:none;background:#e8e6df;color:#111;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700">로그인</button>
  </div>
</div>

<!-- 내부 관리 -->
<div class="app" id="app-internal">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">SP미디어텍</span>
      <span class="topbar-sub">내부 관리</span>
    </div>
    <div class="topbar-right">
      <button class="tbtn primary" onclick="goToSheet()">시트 열기</button>
      <button class="tbtn" onclick="goBack()">← 모드 변경</button>
    </div>
  </div>
  <div class="content">
    <div class="summary-grid">
      <div class="scard"><div class="lbl">전체 프로젝트</div><div class="val v-default" id="s-total">0</div><div class="val-sub" id="s-total-sub"></div></div>
      <div class="scard"><div class="lbl">🔴 긴급 (D-5 이내)</div><div class="val v-red" id="s-urgent">0</div><div class="val-sub">즉시 확인 필요</div></div>
      <div class="scard"><div class="lbl">🟡 출판사 미완료</div><div class="val v-amber" id="s-pub">0</div><div class="val-sub">출판사 액션 필요</div></div>
      <div class="scard"><div class="lbl">✅ 완료</div><div class="val v-green" id="s-done">0</div><div class="val-sub">납품 완료</div></div>
    </div>
    <div class="filter-bar">
      <span class="lbl">보기:</span>
      <button class="fchip on" onclick="setFilter('all',this)">전체</button>
      <button class="fchip" onclick="setFilter('urgent',this)">긴급</button>
      <button class="fchip" onclick="setFilter('pub',this)">출판사 미완료</button>
      <button class="fchip" onclick="setFilter('ing',this)">진행 중</button>
      <button class="fchip" onclick="setFilter('done',this)">완료</button>
    </div>
    <div class="plist" id="internal-list"></div>
  </div>
</div>

<!-- 출판사 화면 -->
<div class="app" id="app-publisher">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">SP미디어텍</span>
      <span class="topbar-sub">제작 현황</span>
    </div>
    <div class="topbar-right"></div>
  </div>
  <div class="content">
    <div id="pub-select"></div>
    <div id="pub-content"></div>
  </div>
</div>



<!-- 엔지니어 화면 -->
<div class="app" id="app-engineer">
  <div class="topbar">
    <div class="topbar-left">
      <span class="topbar-brand">SP미디어텍</span>
      <span class="topbar-sub">엔지니어</span>
    </div>
    <div class="topbar-right">
      <button class="tbtn" onclick="loadData()">🔄 새로고침</button>
      <button class="tbtn" onclick="goBack()">← 돌아가기</button>
    </div>
  </div>
  <div class="content">
    <div id="eng-select"></div>
    <div id="eng-content"></div>
  </div>
</div>

<!-- 상세설명 팝오버 -->
<div class="detail-popup" id="detail-popup" onclick="closePopup(event)">
  <div class="dp-backdrop"></div>
  <div class="dp-box">
    <button class="dp-close" onclick="closePopupDirect()">✕</button>
    <div class="dp-tag" id="dp-tag"></div>
    <div class="dp-title" id="dp-title"></div>
    <div class="dp-how" id="dp-how" style="display:none"></div>
    <div class="dp-desc" id="dp-desc"></div>
  </div>
</div>

<!-- 비밀번호 모달 -->
<div id="pw-modal" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.8);align-items:center;justify-content:center">
  <div style="background:#1a1a1a;border:0.5px solid #333;border-radius:16px;padding:32px 28px;width:320px;text-align:center">
    <div style="font-size:15px;font-weight:700;margin-bottom:4px">내부 관리</div>
    <div style="font-size:12px;color:#555;margin-bottom:20px">비밀번호를 입력해주세요</div>
    <input type="password" id="pw-input" placeholder="비밀번호"
      style="width:100%;background:#111;border:0.5px solid #333;border-radius:8px;padding:10px 14px;color:#e8e6df;font-size:14px;font-family:inherit;outline:none;text-align:center;letter-spacing:3px;margin-bottom:10px"
      onkeydown="if(event.key==='Enter')checkPw()">
    <div id="pw-error" style="font-size:11px;color:#f87171;margin-bottom:10px;display:none">비밀번호가 틀렸습니다</div>
    <div style="display:flex;gap:8px">
      <button onclick="closePwModal()" style="flex:1;padding:9px;border-radius:8px;border:0.5px solid #2a2a2a;background:#161616;color:#888;cursor:pointer;font-family:inherit;font-size:12px">취소</button>
      <button onclick="checkPw()" style="flex:1;padding:9px;border-radius:8px;border:none;background:#e8e6df;color:#111;cursor:pointer;font-family:inherit;font-size:12px;font-weight:700">확인</button>
    </div>
  </div>
</div>

function showPopup(tag, title, desc, how) {
  document.getElementById('dp-tag').textContent = tag;
  document.getElementById('dp-title').textContent = title;
  // \n 이스케이프를 실제 줄바꿈으로 복원

  else { howEl.style.display='none'; }

function closePopup(e) { if(e.target===e.currentTarget||e.target.classList.contains('dp-backdrop')) closePopupDirect(); }
function closePopupDirect() { document.getElementById('detail-popup').classList.remove('open'); }

function loadOv() { try { localOv = JSON.parse(localStorage.getItem('sp_ov')||'{}'); } catch(e){localOv={};} }
function saveOv() { try { localStorage.setItem('sp_ov', JSON.stringify(localOv)); } catch(e){} }

function fmtDate(v) {
  if (!v) return null;
  if (typeof v === 'string' && v.match(/^\d{4}-\d{2}-\d{2}$/)) return v;
  const m = String(v).match(/Date\((\d+),(\d+),(\d+)\)/);
  if (m) { const d = new Date(+m[1],+m[2],+m[3]); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
  return String(v)||null;
}

function getDday(ds) {
  if (!ds) return null;
  const t = new Date(ds); t.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((t-now)/86400000);
}
function ddayTxt(d) { if(d===null)return''; if(d<0)return`D+${Math.abs(d)}`; if(d===0)return'D-day'; return`D-${d}`; }
function ddayChipClass(d) {
  if(d===null)return'chip-gray';
  if(d<0)return'chip-red';
  if(d<=3)return'chip-red';
  if(d<=7)return'chip-amber';
  return'chip-green';
}
function ddayInlineClass(d) {
  if(d===null)return'chip-gray';
  if(d<0)return'chip-red';
  if(d<=3)return'chip-red';
  if(d<=7)return'chip-amber';
  return'chip-gray';
}

async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    const txt = await res.text();
    const json = JSON.parse(txt.replace(/^[^(]+\(/,'').replace(/\);?\s*$/,''));
    const rows = json.table.rows;
    projects = rows.map((row,i) => {
      const c = row.c;
      const id = String(c[0]?.v||(i+1));
      const base = {
        id, pub:c[1]?.v||'', book:c[2]?.v||'',
        currentStep:parseInt((c[3]?.v||'1').toString())||1,
        deadline:fmtDate(c[4]?.v),
        engineer:c[5]?.v||'',
        // c[6] = G열 내부메모 (대시보드 표시 안 함, 시트에서만 관리)
        pubContactName:c[7]?.v||'',
        pubEmail:c[8]?.v||'', engEmail:c[9]?.v||'',
        성우선정:c[10]?.v||'미완료',   성우선정_마감일:fmtDate(c[11]?.v),
        원고전달:c[12]?.v||'미완료',    원고전달_마감일:fmtDate(c[13]?.v),
        타이틀페이지정보:c[14]?.v||'미완료', 타이틀페이지정보_마감일:fmtDate(c[15]?.v),
        북트레일러문구:c[16]?.v||'미완료', 북트레일러문구_마감일:fmtDate(c[17]?.v),
        초안검수피드백:c[18]?.v||'미완료', 초안검수피드백_마감일:fmtDate(c[19]?.v),
        정산정보전달:c[20]?.v||'미완료',  정산정보전달_마감일:fmtDate(c[21]?.v),
        SP_녹음완료_마감일:fmtDate(c[22]?.v),
        SP_편집완료_마감일:fmtDate(c[23]?.v),
        SP_내부검수완료_마감일:fmtDate(c[24]?.v),
        SP_납품완료_마감일:fmtDate(c[25]?.v),
        sheetLink:c[26]?.v||'', contactEmail:c[27]?.v||'contact@spmediatek.com',
        memo:c[28]?.v||'',
        engSheetLink:c[29]?.v||'',
      };
      return {...base, ...(localOv[id]||{})};
    }).filter(p=>p.pub);
    localStorage.setItem('sp_cache', JSON.stringify(projects));
  } catch(e) {
    const cached = localStorage.getItem('sp_cache');
    if (cached) projects = JSON.parse(cached).map(p=>({...p,...(localOv[p.id]||{})}));
  }
  renderAll();
}

function setOv(pid, key, val) {
  if (!localOv[pid]) localOv[pid]={};
  localOv[pid][key]=val;
  saveOv();
  const p = projects.find(x=>x.id===String(pid));
  if(p) p[key]=val;
  showToast();
  renderAll();
}

function showToast() {
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

function hasPubPending(p) { return PUB_CHECKS.some(f=>p[f.key]!=='완료'); }
function pendingCnt(p) { return PUB_CHECKS.filter(f=>p[f.key]!=='완료').length; }
function cardClass(p) {
  if(p.currentStep>=10) return 'done-card';
  const d=getDday(p.deadline);
  if(d!==null&&d<=3) return 'urgent';
  if(hasPubPending(p)) return 'warn';
  return 'ok';
}

const ADMIN_PW = 'spsp'; // 비밀번호

// 메인 화면 비밀번호 제출
function entrySubmit() {
  const val = document.getElementById('entry-pw').value;
  if (val === ADMIN_PW) {
    sessionStorage.setItem('sp_auth', 'ok');
    enterMode('internal');
  } else {
    document.getElementById('entry-err').style.display = 'block';
    document.getElementById('entry-pw').value = '';
    document.getElementById('entry-pw').focus();
  }
}

function enterInternal() {
  // 세션에 인증 기록 있으면 바로 진입
  if (sessionStorage.getItem('sp_auth') === 'ok') {
    enterMode('internal');
    return;
  }
  const modal = document.getElementById('pw-modal');
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('pw-input').focus(), 50);
}

function checkPw() {
  const val = document.getElementById('pw-input').value;
  if (val === ADMIN_PW) {
    sessionStorage.setItem('sp_auth', 'ok');
    closePwModal();
    enterMode('internal');
  } else {
    document.getElementById('pw-error').style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
  }
}

function closePwModal() {
  document.getElementById('pw-modal').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').style.display = 'none';
}

function enterMode(mode, pushState=true) {
  // internal은 인증 없이 절대 진입 불가
  if (mode === 'internal' && sessionStorage.getItem('sp_auth') !== 'ok') {
    enterInternal();
    return;
  }
  currentMode=mode;
  document.getElementById('mode-screen').style.display='none';
  document.querySelectorAll('.app').forEach(a=>a.classList.remove('active'));
  document.getElementById(`app-${mode}`).classList.add('active');
  if(pushState) history.pushState({mode}, '', `?mode=${mode}`);
  renderAll();
}
function goBack(pushState=true) {
  // 출판사/엔지니어 직접 링크로 들어온 경우 모드 선택 화면 노출 금지
  if(directEntry && (currentMode==='publisher'||currentMode==='engineer')) {
    return; // 뒤로가기 막음
  }
  currentMode=null;
  document.getElementById('mode-screen').style.display='flex';
  document.querySelectorAll('.app').forEach(a=>a.classList.remove('active'));
  if(pushState) history.pushState({mode:null}, '', location.pathname);
}
window.addEventListener('popstate', e=>{
  const mode = e.state?.mode;
  if(mode==='publisher'||mode==='internal'||mode==='engineer') enterMode(mode, false);
  else if(directEntry && (currentMode==='publisher'||currentMode==='engineer')) {
    // 직접 진입 시 브라우저 뒤로가기도 막고 원래 페이지 유지
    history.pushState({mode:currentMode}, '', `?mode=${currentMode}`);
  } else {
    goBack(false);
  }
});

function toggleExpand(id){expanded[id]=!expanded[id];renderInternal();}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.fchip').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderInternal();}

function copyLink(mode, name) {
  const base = location.origin+location.pathname;
  let url;
  if (mode === 'publisher') {
    // 출판사 링크는 보안 key 자동 첨부
    const key = genPubKey(name);
    url = `${base}?mode=${mode}&name=${encodeURIComponent(name)}&key=${key}`;
  } else {
    url = `${base}?mode=${mode}&name=${encodeURIComponent(name)}`;
  }
  navigator.clipboard.writeText(url).then(()=>showToast());
}

// ── 출판사 보안 키 생성 ──
// 출판사명에서 고정된 4자리 코드를 만들어 URL 변조를 방지
function genPubKey(name) {
  if (!name) return '';
  // 단순한 해시 — 같은 이름이면 항상 같은 key
  var s = name + 'sp_audiobook_2026';
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h) + s.charCodeAt(i);
    h = h & h;
  }
  // 4자리 36진수 (a~z, 0~9)
  var code = Math.abs(h).toString(36).slice(0, 4).padStart(4, '0');
  return code;
}

// ── 출판사 화면 ────────────
function renderPublisher() {
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  const key  = params.get('key');

  // name 또는 key가 없으면 접근 불가
  if (!name || !key) {
    renderPubBlocked();
    return;
  }
  // key가 일치하지 않으면 접근 불가
  if (key !== genPubKey(name)) {
    renderPubBlocked();
    return;
  }

  selPub = name;
  const myProjects = projects.filter(p=>p.pub===selPub);
  if (!myProjects.length) { renderPubBlocked(); return; }
  renderPubProjects(myProjects);
}

function renderPubBlocked() {
  document.getElementById('pub-select').innerHTML = '';
  document.getElementById('pub-content').innerHTML =
    '<div style="text-align:center;padding:80px 20px;color:#666">' +
    '<div style="font-size:32px;margin-bottom:16px">🔒</div>' +
    '<div style="font-size:15px;color:#888;margin-bottom:8px">접근할 수 없는 페이지입니다</div>' +
    '<div style="font-size:12px;color:#555;line-height:1.7">올바른 링크로 접근해주세요.<br>담당 매니저에게 링크를 요청해 주세요.</div>' +
    '</div>';
}

function renderPubSelect() {
  // 더 이상 출판사 선택 화면을 보여주지 않음 (보안)
  renderPubBlocked();
}

function renderPubProjects(myProjects) {
  document.getElementById('pub-select').innerHTML =
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">' +
    '' +
    '<span style="font-size:16px;font-weight:700;color:#fff">' + selPub + '</span>' +
    '<span class="chip chip-blue">' + myProjects.length + '권 진행 중</span>' +
    '</div>';

  document.getElementById('pub-content').innerHTML = myProjects.map(function(p) {
    var d = getDday(p.SP_납품완료_마감일 || p.deadline);
    var step = STEPS[p.currentStep-1] || STEPS[9];
    var pct = Math.round((p.currentStep/10)*100);
    var pending = PUB_CHECKS.filter(function(f){ return p[f.key] !== '완료'; });
    var done = PUB_CHECKS.filter(function(f){ return p[f.key] === '완료'; });

    var cardCls = p.currentStep >= 10 ? 'done-card' :
                  (d !== null && d <= 3) ? 'urgent' :
                  pending.length > 0 ? 'warn' : 'ok';

    // ── 카드 헤더 (내부용 동일) ──
    var headerHtml =
      '<div class="card-head">' +
        '<div class="card-head-left">' +
          '<div class="card-title-row">' +
            '<span class="pub-name">' + p.pub + '</span>' +
            '<span class="book-name">《' + p.book + '》</span>' +
          '</div>' +
          '<div class="card-meta-row">' +
            '<span class="stage-text">' + (p.currentStep < 10 ? p.currentStep + '단계 · ' + step.name : '✅ 완료') + '</span>' +
            (p.currentStep < 10 ? '<span class="stage-summary">' + step.summary + '</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="card-head-right">' +
          ((p.SP_납품완료_마감일 || p.deadline) ?
            '<span class="dday-chip ' + ddayChipClass(d) + '">납품 ' + ddayTxt(d) + '</span>' : '') +
          '<div style="display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end">' +
            (pending.length > 0 ?
              '<span class="chip chip-amber">📌 ' + pending.length + '건</span>' :
              '<span class="chip chip-green">✅ 완료</span>') +
          '</div>' +
        '</div>' +
      '</div>';

    // ── 진행바 ──
    var progHtml =
      '<div class="prog-wrap">' +
        '<div class="prog-bar"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="prog-pct">' + pct + '%</span>' +
      '</div>';

    // ── 좌측: 타임라인 + SP내부마감일 + 공유문서 ──
    var tlHtml =
      '<div class="ds-title">📊 현재 단계</div>' +
      '<div class="timeline" style="margin-bottom:14px">' +
      STEPS.map(function(s) {
        var cls = s.id < p.currentStep ? 'tl-done' : s.id === p.currentStep ? 'tl-ing' : 'tl-wait';
        var lCls = s.id < p.currentStep ? 'ts-done' : s.id === p.currentStep ? 'ts-ing' : 'ts-wait';
        var icon = s.id < p.currentStep ? '✅' : s.id === p.currentStep ? '🔄' : '○';
        var label = s.id < p.currentStep ? '완료' : s.id === p.currentStep ? '진행 중' : '대기';
        var safeDesc = (s.desc || s.summary).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
        return '<div class="tl-item ' + cls + '">' +
          '<span class="tl-num">' + s.id + '</span>' +
          '<span class="tl-name" onclick="showPopup(\'' + s.id + '단계\',\'' + s.name + '\',\'' + safeDesc + '\',null)">' +
          s.name + '</span>' +
          '<span class="tl-status ' + lCls + '">' + icon + ' ' + label + '</span>' +
          '</div>';
      }).join('') +
      '</div>';

    var sheetHtml = '';
    if (p.sheetLink) {
      sheetHtml =
        '<div class="ds-title" style="margin-top:14px">📝 출판사 공유 문서</div>' +
        '<a href="' + p.sheetLink + '" target="_blank" style="display:block;background:linear-gradient(135deg,#1a3a5c,#1e4976);border:1px solid #2a6496;border-radius:10px;padding:12px 16px;text-decoration:none;color:#60a5fa;font-size:13px;font-weight:600">' +
        '📝 초안 검수 &amp; 피드백 공유 문서 →' +
        '<div style="font-size:11px;color:#777;font-weight:400;margin-top:3px">수정 요청 사항을 타임스탬프와 함께 작성해 주세요</div>' +
        '</a>';
    }

    var contactHtml =
      '<div class="ds-title" style="margin-top:14px">📬 자료 전달</div>' +
      '<div class="contact-row"><span class="ct-label">이메일</span><span class="ct-val">spmediatek@naver.com</span></div>' +
      '<div class="contact-row"><span class="ct-label">제목 형식</span><span class="ct-val">[' + p.pub + '] ' + p.book + ' + 자료명</span></div>';

    var memoHtml = '';
    if (p.memo) {
      memoHtml =
        '<div class="ds-title" style="margin-top:14px">💬 SP미디어텍 메모</div>' +
        '<div style="background:#0d1a2a;border:1px solid #1a3a4a;border-radius:10px;padding:12px 16px;font-size:13px;color:#c0d8f0;line-height:1.7;white-space:pre-wrap">' +
        p.memo +
        '</div>';
    }

    var leftSection =
      '<div class="detail-section">' +
        tlHtml + memoHtml + sheetHtml + contactHtml +
      '</div>';

    // ── 우측: 체크리스트 ──
    var checkItems = '';
    // 미완료
    if (pending.length > 0) {
      checkItems +=
        '<div class="ds-title">출판사 확인 항목 <span class="cnt chip chip-amber">' + pending.length + '건 미완료</span></div>';
      pending.forEach(function(f) {
        var fd = getDday(p[f.dueKey]);
        var safeDesc = (f.desc||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
        var safeHow = (f.how||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
        var dueHtml = p[f.dueKey] ?
          '<span class="chip ' + ddayInlineClass(fd) + '" style="font-size:10px">' + p[f.dueKey] + ' (' + ddayTxt(fd) + ')</span>' : '';
        checkItems +=
          '<div class="check-item">' +
            '<input type="checkbox" disabled style="opacity:0.5;cursor:not-allowed">' +
            '<span class="ci-text" style="flex:1" onclick="showPopup(\'할 일\',\'' + f.label + '\',\'' + safeDesc + '\',\'' + safeHow + '\')">' +
            f.label + '</span>' +
            dueHtml +
          '</div>';
      });
    }
    // 완료
    if (done.length > 0) {
      checkItems +=
        '<div class="ds-title" style="margin-top:12px">완료 항목 <span class="cnt chip chip-green">' + done.length + '건</span></div>';
      done.forEach(function(f) {
        var safeDesc = (f.desc||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
        var safeHow = (f.how||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
        checkItems +=
          '<div class="check-item">' +
            '<input type="checkbox" checked disabled style="opacity:0.5;cursor:not-allowed">' +
            '<span class="ci-text done" style="flex:1" onclick="showPopup(\'할 일\',\'' + f.label + '\',\'' + safeDesc + '\',\'' + safeHow + '\')">' +
            f.label + '</span>' +
            '<span style="font-size:11px;color:#4ade80">완료</span>' +
          '</div>';
      });
    }

    var rightSection = '<div class="detail-section">' + checkItems + '</div>';

    return '<div class="pcard ' + cardCls + '" style="margin-bottom:12px">' +
      headerHtml + progHtml +
      '<div class="card-detail open">' +
        '<div class="detail-grid">' +
          leftSection + rightSection +
        '</div>' +
      '</div>' +
      '</div>';
  }).join('');
}

// ── 엔지니어 화면 ────────────
function renderEngineer() {
  const params = new URLSearchParams(location.search);
  const name = params.get('name');
  let engName = name || null;

  if (!engName) {
    const engs = [...new Set(projects.map(p=>p.engineer).filter(Boolean))];
    document.getElementById('eng-select').innerHTML = `
      <div style="font-size:13px;color:#666;margin-bottom:12px">담당자를 선택해주세요.</div>
      <div class="pub-project-select">
        ${engs.map(e=>`
          <div class="psel-card" onclick="location.search='?mode=engineer&name='+encodeURIComponent('${e}')">
            <span style="font-size:14px;font-weight:700">🎙 ${e}</span>
            <span class="chip chip-blue">${projects.filter(p=>p.engineer===e).length}건</span>
          </div>`).join('')}
      </div>`;
    document.getElementById('eng-content').innerHTML = '';
    return;
  }

  const myProjects = projects.filter(p=>p.engineer===engName);
  document.getElementById('eng-select').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <button class="tbtn" onclick="history.back()">← 목록</button>
      <span style="font-size:14px;font-weight:700;color:#e2e8f0">🎙 ${engName}</span>
      <span class="chip chip-blue">${myProjects.length}건</span>
    </div>`;

  document.getElementById('eng-content').innerHTML = myProjects.map(p=>{
    const step = STEPS[p.currentStep-1]||STEPS[9];
    const pct = Math.round((p.currentStep/10)*100);
    return `<div class="pcard">
      <div class="card-head">
        <div class="card-head-left">
          <div class="card-title-row">
            <span class="pub-name">${p.pub}</span>
            <span class="book-name">《${p.book}》</span>
          </div>
          <div class="card-meta-row">
            <span class="stage-text">${p.currentStep<10?`${p.currentStep}단계 · ${step.name}`:'✅ 완료'}</span>
            <span class="stage-summary">${step.summary}</span>
          </div>
        </div>
      </div>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
        <span class="prog-pct">${pct}%</span>
      </div>
      <div class="timeline" style="margin:12px 0">
        ${STEPS.map(s=>{
          const cls=s.id<p.currentStep?'tl-done':s.id===p.currentStep?'tl-ing':'tl-wait';
          const lCls=s.id<p.currentStep?'ts-done':s.id===p.currentStep?'ts-ing':'ts-wait';
          const icon=s.id<p.currentStep?'✅':s.id===p.currentStep?'🔄':'○';
          const label=s.id<p.currentStep?'완료':s.id===p.currentStep?'진행 중':'대기';
          const sd=(s.desc||s.summary).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
          return `<div class="tl-item ${cls}">
            <span class="tl-num">${s.id}</span>
            <span class="tl-name" onclick="showPopup('${s.id}단계','${s.name}','${sd}',null)">
              ${s.name}
            </span>
            <span class="tl-status ${lCls}">${icon} ${label}</span>
          </div>`;
        }).join('')}
      </div>
      ${p.engSheetLink?`<a href="${p.engSheetLink}" target="_blank" class="link-btn" style="margin-top:8px">📊 작업 시트 열기 →</a>`:''}
    </div>`;
  }).join('');
}

function renderAll() {
  if(currentMode==='internal') renderInternal();
  else if(currentMode==='publisher') renderPublisher();
  else if(currentMode==='engineer') renderEngineer();
}

function checkUrl() {
  const p=new URLSearchParams(location.search);
  const mode=p.get('mode');
  if(mode==='publisher'||mode==='engineer') {
    directEntry = true;
    history.replaceState({mode}, '', location.href);
    enterMode(mode, false);
  } else if(mode==='internal') {
    // URL로 internal 직접 접근 시 비밀번호 요구
    history.replaceState({mode:null}, '', location.pathname);
    enterInternal();
  } else {
    history.replaceState({mode:null}, '', location.href);
  }
}

loadOv();
loadData().then(()=>checkUrl());
</script>
