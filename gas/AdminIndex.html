<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  * { box-sizing:border-box; margin:0; }
  :root { --nv:#1f3b57; --nvL:#eef3f8; --nvLine:#d6e0ea; --red:#b23a2f; --redL:#fdf0ee; --bd:#e4e6ea; }
  body { font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; background:#f4f6f8; color:#151a20; }

  .app { display:flex; min-height:100vh; }
  .side { width:200px; flex:none; background:var(--nv); color:#fff; padding:22px 12px 16px;
          position:sticky; top:0; height:100vh; display:flex; flex-direction:column; }
  .side .brand { font-size:10.5px; letter-spacing:.16em; color:#8fa5ba; font-weight:800; padding:0 10px; }
  .side .who { font-size:15px; font-weight:800; color:#fff; padding:5px 10px 0; }
  .side .whosub { font-size:11px; color:#8fa5ba; padding:2px 10px 0; }
  nav.menu { margin-top:18px; display:flex; flex-direction:column; gap:3px; }
  nav.menu a { display:flex; align-items:center; gap:9px; padding:10px 11px; border-radius:9px;
               color:#c3d0dc; font-size:13.5px; font-weight:600; text-decoration:none; cursor:pointer; }
  nav.menu a svg { width:16px; height:16px; flex:none; }
  nav.menu a.on { background:rgba(255,255,255,.15); color:#fff; font-weight:800; }
  nav.menu a:hover { color:#fff; }
  .badge { margin-left:auto; min-width:19px; text-align:center; font-size:11px; font-weight:800;
           padding:1px 6px; border-radius:10px; background:#d8574a; color:#fff; }
  .badge.soft { background:rgba(255,255,255,.22); color:#fff; }
  .side .foot { margin-top:auto; padding:0 4px; }
  .side .foot button { width:100%; padding:10px; font-size:12.5px; font-weight:800; border-radius:9px;
                       border:1px solid rgba(255,255,255,.35); background:transparent; color:#fff; cursor:pointer; font-family:inherit; }
  .side .foot .cap { font-size:10.5px; color:#7e93a8; line-height:1.6; margin-top:8px; padding:0 4px; }

  .main { flex:1; min-width:0; padding:24px 18px 90px; }
  .inner { max-width:900px; margin:0 auto; }
  h1.tt { font-size:20px; font-weight:800; letter-spacing:-.01em; }
  p.greet { font-size:13px; color:#5f6b78; margin-top:6px; line-height:1.7; }
  h2.sec { font-size:12.5px; letter-spacing:.09em; color:var(--nv); font-weight:800; margin:24px 0 10px; }
  h2.sec:first-child { margin-top:8px; }
  h2.sec .cnt { color:#98a4b0; margin-left:5px; letter-spacing:0; }

  .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:15px 16px;
          box-shadow:0 1px 2px rgba(20,35,55,.05); }
  .card + .card { margin-top:10px; }
  .empty { padding:22px 14px; text-align:center; color:#8a94a0; font-size:13px; background:#fff; border:1px dashed #ccd2d9; border-radius:14px; }
  .banner { background:#fbf7ef; border:1px solid #eee3cf; border-radius:12px; padding:12px 14px;
            font-size:12.5px; line-height:1.7; color:#6d5a33; margin-bottom:12px; }

  /* 홈 지표 카드 */
  .metrics { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; }
  .metric { background:#fff; border:1px solid var(--bd); border-radius:13px; padding:13px 14px; cursor:pointer;
            box-shadow:0 1px 2px rgba(20,35,55,.05); }
  .metric:hover { border-color:#b9c5d1; }
  .metric b { display:block; font-size:23px; font-weight:800; color:var(--nv); }
  .metric.warn b { color:var(--red); }
  .metric span { display:block; font-size:12px; color:#7c8792; font-weight:700; margin-top:3px; }
  .duerow { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--bd);
            border-radius:12px; padding:11px 14px; margin-top:8px; cursor:pointer; }
  .duerow:hover { border-color:#b9c5d1; }
  .duerow b { font-size:13.5px; flex:1; min-width:0; }
  .duerow .dd { font-size:12px; font-weight:800; padding:4px 10px; border-radius:8px; background:#f0f2f5; color:#5f6b78; }
  .duerow .dd.soon { background:var(--redL); color:var(--red); }
  /* 홈: 전체 진행 현황 */
  .prow2 { display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--bd);
           border-radius:12px; padding:10px 14px; margin-top:8px; cursor:pointer; flex-wrap:wrap; }
  .prow2:hover { border-color:#b9c5d1; }
  .prow2 .bt { font-size:13.5px; font-weight:800; flex:1; min-width:150px; }
  .prow2 .bar { flex:2; min-width:130px; height:9px; background:#e7ebf0; border-radius:5px; overflow:hidden; display:block; }
  .prow2 .bar i { display:block; height:100%; background:var(--nv); }
  .prow2.done10 .bar i { background:#1d6b2a; }
  .prow2 .stepc { font-size:11px; font-weight:800; color:#5f6b78; min-width:90px; }

  /* 공통 칩·필 */
  .chip { font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; border:1px solid #d5dae0; color:#4c5866; background:#fff; white-space:nowrap; }
  .chip.navy { background:var(--nv); border-color:var(--nv); color:#fff; }
  .chip.gray { background:#eef0f2; border-color:#e2e5e9; color:#7c8792; }
  .chip.redln { background:var(--redL); border-color:#ecccc5; color:var(--red); }
  .pill { font-size:11.5px; font-weight:700; padding:2px 9px; border-radius:10px; background:#e8ecf1; color:#41546b; }
  .p-wait { background:#fde7e9; color:#b23a2f; }
  .p-rec  { background:#fdf1d7; color:#8a5a00; }
  .p-up   { background:#e3e6f5; color:#3f4a7e; }
  .p-done { background:#e2f2e4; color:#1d6b2a; }
  .p-eng  { background:#f1e7f5; color:#6a1b9a; }
  .p-pub  { background:#e3ecf9; color:#1f3b57; }
  .p-int  { background:#efe9f7; color:#5b3f8a; }

  /* 도서 관리 */
  .bhead { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .bhead .tt { font-size:16px; font-weight:800; }
  .bhead .sub { font-size:12px; color:#7c8792; font-weight:600; }

  /* v2.0 — 도서명 타이포 (출판사 작게·연하게 / 도서명 크게·진하게) */
  .btitle { display:inline-flex; align-items:baseline; gap:7px; min-width:0; }
  .btitle .pb { font-size:13.5px; font-weight:800; color:#1f3b57; letter-spacing:-.01em; white-space:nowrap;
                background:#eef3f9; border:1px solid #d8e3ee; border-radius:6px; padding:2px 7px; }
  .btitle .nm { font-size:16.5px; font-weight:800; color:#16283c; letter-spacing:-.015em; }
  .btitle .nm .q { color:#c3ccd6; font-weight:600; }
  .sumrow .btitle .nm, .prow2 .btitle .nm { font-size:15px; }

  /* v2.0 — 접힌 줄 요약(성우·러닝타임) */
  .bmeta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:6px;
           font-size:12px; color:#78838f; font-weight:600; line-height:1.5; }
  .bmeta .k { color:#a6b0bb; font-weight:800; font-size:10.5px; letter-spacing:.03em; }
  .bmeta .rt { font-weight:800; color:#41546b; }
  .bmeta .dot { color:#ccd3da; }

  /* v2.0 — 그룹(차수) 헤더 */
  .grphd { display:flex; align-items:center; gap:9px; margin:20px 2px 8px; flex-wrap:wrap; }
  .grphd h3 { font-size:13px; font-weight:800; color:var(--nv); letter-spacing:-.01em; }
  .grphd .cnt { font-size:11.5px; font-weight:800; color:#96a2ae; }
  .grphd .ln { flex:1; height:1px; background:linear-gradient(90deg,#dfe4ea,transparent); min-width:20px; }

  /* v2.0 — 순서 변경 버튼 */
  .ord { display:flex; flex-direction:column; gap:2px; margin-right:2px; }
  .ord button { width:22px; height:16px; padding:0; font-size:9px; line-height:1;
                border:1px solid #dde2e8; background:#fff; color:#8a94a0; border-radius:5px; cursor:pointer; }
  .ord button:hover { background:#f2f5f8; color:var(--nv); border-color:#c3ccd6; }
  .ord button:disabled { opacity:.3; cursor:default; }

  /* v2.2 — 그룹 필터 탭 */
  .gtabs { display:flex; gap:6px; flex-wrap:wrap; margin:12px 0 4px;
           border-bottom:1.5px solid #e6eaee; padding-bottom:0; }
  .gtab { padding:9px 15px; font-size:13px; font-weight:800; color:#8a96a3; cursor:pointer;
          background:none; border:0; border-bottom:2.5px solid transparent; margin-bottom:-1.5px;
          font-family:inherit; white-space:nowrap; }
  .gtab:hover { color:var(--nv); }
  .gtab.on { color:var(--nv); border-bottom-color:var(--nv); }
  .gtab .c { font-size:11px; font-weight:800; color:#aab4bf; margin-left:5px; }
  .gtab.on .c { color:var(--nv); }

  /* v2.2 — 시트 바로가기 */
  .shortcuts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .shortcuts a { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; font-size:12.5px;
                 font-weight:800; color:#1f3b57; background:#fff; border:1px solid #d8e3ee;
                 border-radius:9px; text-decoration:none; }
  .shortcuts a:hover { background:#eef3f9; border-color:#b9cbe0; }

  /* v2.2 — 확인 필요 알림 */
  .alrt { display:flex; align-items:flex-start; gap:9px; padding:11px 13px; margin-bottom:7px;
          background:#fff; border:1px solid #e6eaee; border-left-width:4px; border-radius:10px; cursor:pointer; }
  .alrt:hover { background:#fafbfc; }
  .alrt.k-pub { border-left-color:#1f6feb; }
  .alrt.k-rec { border-left-color:#2f7d32; }
  .alrt.k-wait { border-left-color:#c0392b; }
  .alrt.k-due { border-left-color:#e08600; }
  .alrt .tg { font-size:10px; font-weight:800; padding:3px 7px; border-radius:5px; white-space:nowrap; margin-top:1px; }
  .k-pub .tg { background:#e8f0fe; color:#1f6feb; }
  .k-rec .tg { background:#e8f5e9; color:#2f7d32; }
  .k-wait .tg { background:#fdeceb; color:#c0392b; }
  .k-due .tg { background:#fff4e0; color:#b06a00; }
  .alrt .bd { min-width:0; flex:1; }
  .alrt .t1 { font-size:13px; font-weight:800; color:#22303f; line-height:1.45; }
  .alrt .t2 { font-size:11.5px; color:#8a94a0; margin-top:2px; line-height:1.5; }
  .fldlab { font-size:10.5px; color:#98a1ab; font-weight:800; margin:11px 0 4px; letter-spacing:.03em; }
  .frow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  select, input[type=text] { padding:9px 10px; font-size:13.5px; border:1px solid #cfd6dd; border-radius:9px;
                             font-family:inherit; background:#fff; color:#151a20; }
  select:focus, input:focus, textarea:focus { outline:none; border-color:var(--nv); }
  textarea { width:100%; padding:9px 10px; font-size:13.5px; border:1px solid #cfd6dd; border-radius:9px;
             font-family:inherit; min-height:52px; resize:vertical; line-height:1.6; }
  button { padding:9px 12px; font-size:12.5px; font-weight:800; border-radius:9px; border:1px solid #cfd6dd;
           background:#fff; color:#3c4652; cursor:pointer; font-family:inherit; }
  button.primary { background:var(--nv); border-color:var(--nv); color:#fff; }
  button.small { padding:6px 10px; font-size:12px; font-weight:700; }
  button:disabled { opacity:.45; cursor:default; }
  .savemark { font-size:12px; font-weight:800; }
  .cks { display:flex; gap:6px; flex-wrap:wrap; }
  .ckc { font-size:11.5px; font-weight:800; padding:5px 11px; border-radius:16px; cursor:pointer; border:1px solid; user-select:none; }
  .ckc.on { background:#1d6b2a; border-color:#1d6b2a; color:#fff; }
  .ckc.off { background:var(--redL); border-color:#ecccc5; color:var(--red); }
  .ckc.off.od { background:var(--red); border-color:var(--red); color:#fff; }
  .ckc.mid { background:#fdf1d7; border-color:#f0dcae; color:#8a5a00; }
  .ckc.busy { opacity:.5; }
  .ckc small { font-weight:700; opacity:.75; margin-left:4px; }
  a.linkbtn { display:inline-block; font-size:12px; font-weight:700; color:var(--nv); text-decoration:none;
              border:1px solid #c2cdd8; padding:6px 11px; border-radius:8px; background:#fff; }
  .msg { margin-top:8px; font-size:12.5px; color:#5f6b78; line-height:1.6; }
  .msg.ok { color:#1d6b2a; font-weight:800; }
  .msg.bad { color:var(--red); font-weight:800; }
  details.fold { margin-top:11px; border:1px solid #e9ebee; border-radius:11px; background:#fafbfc; }
  details.fold > summary { list-style:none; cursor:pointer; padding:10px 13px; font-size:12.5px; font-weight:800; color:var(--nv); }
  details.fold > summary::-webkit-details-marker { display:none; }
  details.fold .fin { padding:0 13px 12px; }
  .castline { display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:13px; margin-top:7px; }
  .castline .role { font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:10px; background:#f1e7f5; color:#6a1b9a; }
  .method { font-size:11.5px; color:#98a1ab; }

  /* 새 도서 추가 */
  .addgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px; margin-top:4px; }
  .addgrid label { display:block; font-size:10.5px; color:#98a1ab; font-weight:800; margin-bottom:3px; }
  .addgrid input, .addgrid select { width:100%; }

  /* 수정·검수 */
  .stats { display:flex; gap:8px; flex-wrap:wrap; }
  .stat { flex:1; min-width:92px; background:#fff; border:1px solid var(--bd); border-radius:12px; padding:10px 12px; text-align:center; }
  .stat b { display:block; font-size:19px; color:var(--nv); font-weight:800; }
  .stat.warn b { color:var(--red); }
  .stat span { font-size:11.5px; color:#8a94a0; font-weight:700; }
  .fbar { display:flex; gap:7px; flex-wrap:wrap; margin:12px 0 10px; align-items:center; }
  .fbar button.f { padding:7px 13px; border-radius:20px; font-size:12.5px; }
  .fbar button.f.on { background:var(--nv); border-color:var(--nv); color:#fff; }
  details.grp { background:#fff; border:1px solid var(--bd); border-radius:14px; margin-bottom:10px;
                box-shadow:0 1px 2px rgba(20,35,55,.05); }
  details.grp > summary { padding:13px 15px; cursor:pointer; list-style:none; }
  details.grp > summary::-webkit-details-marker { display:none; }
  .sumrow { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .sumrow .tt { font-size:15px; font-weight:800; }
  .sumrow .tt::before { content:'▸ '; color:#b7c0ca; font-weight:400; }
  details.grp[open] .sumrow .tt::before { content:'▾ '; }
  .ginner { padding:0 15px 14px; }
  .item { background:#fafbfc; border:1px solid #e9ebee; border-radius:11px; padding:11px 12px; margin-top:9px; }
  .row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .idb { font-size:12px; font-weight:800; padding:2px 9px; border-radius:10px; background:var(--nvL); color:var(--nv); }
  .snippet { font-size:13.5px; margin-top:6px; line-height:1.6; }
  .meta { font-size:12px; color:#8a94a0; margin-top:4px; }
  .btns { display:flex; gap:6px; margin-top:9px; flex-wrap:wrap; }
  button.v { border-color:#c2cdd8; color:var(--nv); }
  button.v.sel { background:var(--nv); border-color:var(--nv); color:#fff; }
  button.done { background:#1d6b2a; border-color:#1d6b2a; color:#fff; }
  audio { width:100%; margin-top:8px; height:34px; }

  .castsum { font-size:12.5px; color:#4c5866; margin-top:8px; padding:8px 11px; background:#f6f8fa; border-radius:9px; line-height:1.7; }
  .duelab { font-size:12px; font-weight:800; color:#4c5866; min-width:118px; }
  .duecur { font-size:12px; color:#8a94a0; min-width:86px; }
  .adminmemo { margin-top:7px; padding:8px 11px; background:#fdf1d7; border:1px solid #f0dcae; border-radius:9px;
               font-size:12.5px; font-weight:600; color:#8a5a00; line-height:1.55; }
  .memobox { margin-top:8px; padding:9px 10px; background:#f6f8fa; border:1px dashed #ccd5de; border-radius:10px; }
  .memobox textarea { min-height:44px; }
  .tcbig { display:inline-block; margin-top:8px; padding:7px 14px; background:var(--nv); color:#fff; border-radius:9px;
           font-size:15px; font-weight:800; letter-spacing:.03em; }
  .chip.rtc { background:#eef3f9; color:#1f3b57; border-color:#c9d8e8; font-weight:800; }
  .chip.music { background:#eef7ee; color:#1d5e22; border-color:#c3e0c4; }
  button.small.okbtn { background:#eef7ee; border-color:#a9d3ab; color:#1d5e22; font-weight:800; }
  .who { font-size:10.5px; font-weight:800; padding:3px 8px; border-radius:6px; white-space:nowrap; }
  .who.w-eng { background:#e8f0fe; color:#1a56b8; }
  .who.w-rev { background:#f3e8fd; color:#7028b8; }
  .who.w-pub { background:#fff1e0; color:#a8620a; }
  .who.w-adm { background:#e7f6f4; color:#0d7a6c; }
  /* v2.7 — 위치 정보 강조 · 오류 유형 빨간 배지 */
  .locline { display:flex; gap:6px; flex-wrap:wrap; margin-top:7px; }
  .locchip { display:inline-flex; align-items:center; gap:4px; padding:5px 10px;
             background:#1f3b57; color:#fff; border-radius:7px;
             font-size:13px; font-weight:800; }
  .locchip .ic { font-size:12px; }
  .pill.p-type { background:#fdeceb; color:#c0392b; border:1px solid #f2c4c0; font-weight:800; }
  .fixnote { margin-top:8px; padding:9px 12px; background:#eef7ee; border:1px solid #c3e0c4;
             border-radius:9px; font-size:12.5px; color:#1d5e22; line-height:1.55; }
  .fixnote b { font-weight:800; }
  iframe.finframe { width:100%; height:400px; border:0; border-radius:9px; background:#f0f2f5; margin-top:8px; display:block; }
  .finwrap audio { width:100%; }
  .finwrap { min-width:0; overflow:hidden; }
  .rtblwrap { margin-top:9px; border:1px solid #e9ebee; border-radius:11px; overflow:hidden; overflow-x:auto; background:#fff; }
  table.rtbl { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.rtbl th { background:#f2f5f8; color:var(--nv); font-size:11.5px; text-align:left; padding:8px 10px; white-space:nowrap; }
  table.rtbl td { padding:7px 10px; border-top:1px solid #f0f2f4; vertical-align:top; }

  /* 파트너 */
  .prow { background:#fff; border:1px solid var(--bd); border-radius:13px; padding:13px 15px; margin-top:9px;
          box-shadow:0 1px 2px rgba(20,35,55,.05); }
  .prow .r1 { display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
  .prow .nm { font-size:15px; font-weight:800; }
  .prow .pm { font-size:12px; color:#7c8792; margin-top:5px; line-height:1.7; word-break:break-all; }
  .prow .pb { display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
  .acctline { margin-top:9px; padding:9px 12px; background:var(--nvL); border:1px solid var(--nvLine); border-radius:9px;
              font-size:13px; font-weight:700; color:#28415c; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  /* 캐스팅 */
  .creq { display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:10px 0; border-top:1px solid #eff1f3; font-size:13px; }
  .creq:first-of-type { border-top:0; }
  .creq b { min-width:70px; }
  .creq .cm { font-size:12px; color:#8a94a0; }

  .note { font-size:12px; color:#98a1ab; margin-top:22px; line-height:1.8; }

  /* v2.3 원고 패널 */
  #msPanel { position:fixed; right:12px; top:12px; bottom:12px; width:min(44vw,700px); z-index:80; background:#fff;
    border:1px solid var(--bd); border-radius:14px; box-shadow:0 10px 34px rgba(20,35,55,.25); display:none; flex-direction:column; overflow:hidden; }
  #msPanel .mshead { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid #edeff2;
    font-size:12.5px; font-weight:800; color:var(--nv); }
  #msPanel iframe { flex:1; width:100%; border:0; }
  body.msopen #msPanel { display:flex; }
  body.msopen .main { padding-right:calc(min(44vw,700px) + 28px); }
  @media (max-width:1000px) { body.msopen #msPanel { left:12px; width:auto; } body.msopen .main { padding-right:16px; } }

  /* v2.3 출결 */
  .attbars { display:grid; gap:3px; margin-top:12px; align-items:end; }

<script>
let DATA = <?!= data ?>;
const TOKEN = DATA.token;

/* v2.0 — 출판사(작게·연하게) + 도서명(크게·진하게) */
function bookTitleEl(pub, title) {

/* v2.0 — 접힌 줄에 보여줄 담당 성우 · 러닝타임 요약 */
function bookMetaEl(b) {
  const cast = (b.cast || []).filter(x => x.actor);
  if (!cast.length && !b.rt && !b.eng) return null;

  if (cast.length) {
    w.appendChild(el('span', 'k', '성우'));

  if (b.rt || b.rtEst) {

    w.appendChild(el('span', 'k', b.rt ? 'RT' : '예상 RT 🔒'));
    w.appendChild(el('span', 'rt', b.rt || b.rtEst));
  }
  if (b.eng) {
    if (cast.length || b.rt) w.appendChild(el('span', 'dot', '|'));
    w.appendChild(el('span', 'k', '엔지니어'));
    w.appendChild(document.createTextNode(b.eng + (b.reviewer ? ' · 검수 ' + b.reviewer : '')));
  }

}
function srv(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((res, rej) => {
    const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args);

}
function dday(dstr) {
  if (!dstr) return null;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let d = null;
  const m = String(dstr).trim().match(/^(\d{1,2})[\/\.](\d{1,2})$/);
  if (m) {
    const y = t.getFullYear();
    [y - 1, y, y + 1].forEach(yy => {

      if (d === null || Math.abs(c - t) < Math.abs(d - t)) d = c;

    d.setHours(0, 0, 0, 0);

}
function ddayTxt(n) { return n === null ? '' : (n === 0 ? 'D-DAY' : (n > 0 ? 'D-' + n : 'D+' + (-n))); }
async function copyText(t, mark) {

  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';

}
function markBusy(mark) { mark.textContent = '저장 중…'; mark.style.color = '#888'; }
function markOk(mark, t) { mark.textContent = t || '저장됨 ✓'; mark.style.color = '#1d6b2a'; setTimeout(() => { mark.textContent = ''; }, 1800); }
function markBad(mark, e) { mark.textContent = '실패: ' + (e.message || e); mark.style.color = '#b23a2f'; }
function safeReload() { try { location.reload(); } catch (e) {} }
document.getElementById('reloadBtn').onclick = safeReload;

/* ── 데이터 준비: QC 도서 ↔ 프로젝트DB 매칭 ──
   v2.5: 잠금이 걸린 경우 비밀번호를 맞춘 뒤에 데이터가 오므로, 준비 과정을 함수로 분리했습니다. */
let PROD = null;
let prodByTitle = {};

let finalRefByBook = {};

function prepData() {
  PROD = DATA.prod || null;
  prodByTitle = {};
  if (PROD) PROD.rows.forEach(r => { prodByTitle[r.title] = r; });
  (DATA.books || []).forEach(b => { b._prod = prodByTitle[(b.pdbTitle || b.title)] || null; });
  pubLinkByName = {}; engLinkByName = {}; actorLinkByName = {};
  ((DATA.partners || {}).pubs || []).forEach(p => { if (p.link && !pubLinkByName[p.pubName]) pubLinkByName[p.pubName] = p.link; });
  ((DATA.partners || {}).engineers || []).forEach(p => { if (p.link) engLinkByName[p.name] = p.link; });
  ((DATA.partners || {}).actors || []).forEach(p => { if (p.link) actorLinkByName[p.name] = p.link; });
  finalRefByBook = {};
  (DATA.books || []).forEach(b => {
    if (!b.finalUrl) return;
    const m = String(b.finalUrl).match(/[-\w]{25,}/);
    finalRefByBook[b.title] = { url: b.finalUrl, id: (m && String(b.finalUrl).indexOf('/folders/') < 0) ? m[0] : '' };
  });
}

function pdbOnlyRows() {
  if (!PROD) return [];
  const used = {};
  DATA.books.forEach(b => { if (b._prod) used[b._prod.pid] = true; });
  return PROD.rows.filter(r => !used[r.pid]);
}

/* ── 이슈 상태 (기존 로직 유지) ── */
function stateOf(i) {
  if (i.applied === '반영완료') return 'done';
  if (i.verdict === '대기' || !i.verdict) return 'wait';
  if (i.verdict === '그냥 진행' || i.verdict === '수정 불가') return 'done';
  return 'prog';
}
function isArrived(i) { return i.recstat === '업로드완료' && i.applied !== '반영완료'; }
function issuesFor(title) { return DATA.issues.filter(i => i.book === title); }
function adminMemoOf(i) {
  const l = String(i.note || '').split('\n').find(x => x.indexOf('[대표 메모]') === 0);
  return l ? l.replace('[대표 메모]', '').trim() : '';
}
function setLocalAdminMemo(i, memo) {
  const kept = String(i.note || '').split('\n').filter(l => l.indexOf('[대표 메모]') !== 0);
  if (memo) kept.unshift('[대표 메모] ' + memo);

/* ── 탭 전환 ── */
const TABS = ['home', 'books', 'qc', 'partners', 'rec', 'att'];
const S = { tab: 'home', f: 'wait', fBook: '*', fWho: 'all' };
document.querySelectorAll('#menu a').forEach(a => {
  a.onclick = ev => { ev.preventDefault(); go(a.dataset.tab); };
});
function go(tab, opt) {
  S.tab = tab;
  if (opt && opt.f) S.f = opt.f;
  if (opt && opt.fBook !== undefined) S.fBook = opt.fBook;
  TABS.forEach(t => { document.getElementById('tab-' + t).style.display = (t === S.tab) ? '' : 'none'; });
  document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('on', a.dataset.tab === S.tab));

  window.scrollTo(0, 0);
  if (opt && opt.scroll) {
    const t = document.getElementById(opt.scroll);

      if (t.tagName === 'DETAILS' && !t.open) { t.open = true; }

}
function render() {
  renderBadges();
  if (S.tab === 'home') renderHome();
  else if (S.tab === 'books') renderBooks();
  else if (S.tab === 'qc') renderQc();
  else if (S.tab === 'partners') renderPartners();
  else if (S.tab === 'rec') renderRec();
  else renderAtt();
}
function counts() {
  const n = { wait: 0, up: 0, rec: 0, pubwait: 0, done: 0, total: 0 };
  DATA.issues.forEach(i => {
    n.total++;
    const s = stateOf(i);
    if (s === 'wait') n.wait++;
    if (s === 'done') n.done++;
    if (isArrived(i)) n.up++;
    if (i.recstat === '요청됨') n.rec++;
    if (i.stage === '출판사검수' && s === 'wait') n.pubwait++;

}

  const n = counts();
  const q = document.getElementById('bdgQc');
  q.style.display = n.wait ? '' : 'none'; q.textContent = n.wait;
  /* v3.1 — 홈 뱃지는 "새 소식"(출판사 제출·업데이트·재녹음 도착)만 셉니다.
     예전에는 판정 대기 수(수십 건)가 그대로 떠서 늘 빨간 숫자였고, 그 탓에

  const news = (DATA.alerts || []).filter(a => a.kind !== 'wait').length + (DATA.alertLog || []).length;

}

/* ══════════════════ 홈 ══════════════════ */
/* v2.2.1 — 확인 필요 알림 (출판사 제출·재녹음 도착·판정 대기)
   v3.1 — 기본 필터를 [새 소식]으로: 판정 대기(수십 건)가 알림을 뒤덮어

let alertFilter = 'new';

function renderAlerts(box) {

      } catch (e) { ack.disabled = false; ack.textContent = '확인'; }
    };
    /* v2.5 — 그 출판사 화면을 새 탭에서 바로 열기 (파트너 탭에서 찾아 들어갈 필요 없음) */

  function draw() {
    Array.prototype.forEach.call(tabs.children, t => {
      t.className = 'gtab' + (t.dataset.k === alertFilter ? ' on' : '');
    });

    const showEvt = (alertFilter === 'all' || alertFilter === 'new' || alertFilter === 'evt') && evts.length;
    if (showEvt) {
      evts.forEach(a => listBox.appendChild(evtRow(a)));
      if (alertFilter === 'evt' && evts.length > 1) {
        const allAck = el('button', 'small', '모두 확인 처리');
        allAck.style.margin = '8px 0 2px';
        allAck.onclick = async () => {
          allAck.disabled = true; allAck.textContent = '처리 중…';
          try { await srv('adminAckAlert', TOKEN, '*'); DATA.alertLog = []; renderHome(); }
          catch (e) { allAck.disabled = false; allAck.textContent = '모두 확인 처리'; }
        };
        listBox.appendChild(allAck);
      }
    }
    const list = alertFilter === 'evt' ? []
      : alertFilter === 'new' ? all.filter(a => a.kind !== 'wait')
      : all.filter(a => alertFilter === 'all' || a.kind === alertFilter);
    if (!list.length && !showEvt) {
      const waitN = all.filter(a => a.kind === 'wait').length;
      listBox.appendChild(el('div', 'empty',
        alertFilter === 'new' && waitN
          ? '✓ 새 소식이 없습니다. 판정 대기 ' + waitN + '건은 [수정·검수] 탭에서 처리하실 수 있습니다.'
          : '해당 알림이 없습니다.'));
      return;
    }
    list.slice(0, 60).forEach(a => {
      const w = el('div', 'alrt k-' + a.kind);
      w.appendChild(el('span', 'tg', TAG[a.kind] || ''));
      const bd = el('div', 'bd');
      bd.appendChild(el('div', 't1', (a.pub ? a.pub + ' ' : '') + '『' + a.book + '』 — ' + a.text));
      if (a.detail) bd.appendChild(el('div', 't2', a.detail));
      w.appendChild(bd);
      w.onclick = () => go('qc', { f: a.kind === 'rec' ? 'up' : 'wait', fBook: a.book });
      listBox.appendChild(w);
    });
    if (list.length > 60) listBox.appendChild(el('div', 'meta', '외 ' + (list.length - 60) + '건 — [수정·검수] 탭에서 전체를 보실 수 있습니다.'));
  }
  draw();
}

  rows.sort((a, b2) => {

    const i2 = el('i');

    const nn = dday(s.dl);

    if (s.up) r.appendChild(el('span', 'pill p-up', '도착 ' + s.up));
    const d = document.createElement('details');
    d.className = 'homefold';
    const smy = document.createElement('summary');
    smy.appendChild(r);
    d.appendChild(smy);
    const body = el('div', 'homebody');
    d.appendChild(body);

    d.addEventListener('toggle', () => {
      if (d.open && !built) { built = true; body.appendChild(bareCard(s.card())); }
    });
    listBox.appendChild(d);
  }

  draw();

  /* v2.2 — 확인 필요 알림 (v3.1: 보드 아래로 이동, 기본 [새 소식]) */
  renderAlerts(box);

  /* v2.2 — 시트 바로가기 (v3.1: 맨 아래로 이동) */
  const su = DATA.sheetUrls || {};
  if (su.qc || su.pdb) {
    box.appendChild(el('h2', 'sec', '시트 바로가기'));
    const sc = el('div', 'shortcuts');
    if (su.qc) { const a = document.createElement('a'); a.href = su.qc; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '📗 QC 마스터 시트 열기'; sc.appendChild(a); }
    if (su.pdb) { const a2 = document.createElement('a'); a2.href = su.pdb; a2.target = '_blank'; a2.rel = 'noopener'; a2.textContent = '📈 프로젝트DB 열기'; sc.appendChild(a2); }
    if (su.cost) { const a3 = document.createElement('a'); a3.href = su.cost; a3.target = '_blank'; a3.rel = 'noopener'; a3.textContent = '💰 제작비 시트'; sc.appendChild(a3); }
    if (su.alldb) { const a4 = document.createElement('a'); a4.href = su.alldb; a4.target = '_blank'; a4.rel = 'noopener'; a4.textContent = '🗂 전체 오디오북 제작 DB'; sc.appendChild(a4); }
    box.appendChild(sc);
  }
}

/* v2.2 — 그룹(차수) 탭 만들기. 그룹이 하나뿐이면 탭을 만들지 않습니다 */
let homeGroup = '__all__';
let bookGroup = '__all__';

function groupTabs(rows, onPick) {
  const names = [];
  rows.forEach(r => {
    const g = (r.group || '미해당').trim() || '미해당';
    if (names.indexOf(g) < 0) names.push(g);
  });
  if (names.length < 2) return null;
  names.sort((a, b) => {
    if (a === '미해당') return 1;
    if (b === '미해당') return -1;
    return a.localeCompare(b, 'ko');
  });
  const w = el('div', 'gtabs');
  const mk = (key, label, cnt) => {
    const t = el('button', 'gtab', label);
    t.dataset.g = key;
    t.appendChild(el('span', 'c', String(cnt)));
    t.onclick = () => onPick(key);
    w.appendChild(t);
  };
  mk('__all__', '전체', rows.length);
  names.forEach(nm => mk(nm, nm, rows.filter(r => ((r.group || '미해당').trim() || '미해당') === nm).length));
  return w;
}

/** 카드 껍데기(테두리·그림자) 제거 — 드롭다운 안에 넣을 때 사용 */
function bareCard(cardEl) {
  cardEl.style.border = '0';
  cardEl.style.boxShadow = 'none';
  cardEl.style.padding = '0';
  cardEl.style.marginTop = '0';
  return cardEl;
}

/* ══════════════════ 도서 관리 ══════════════════ */
/* v2.0 — 그룹(차수) 분류 · 순서 변경 ------------------------------------ */
function groupBooks(list) {
  const m = {}, order = [];
  list.forEach((b, idx) => {
    const g = (b.group || '미분류').trim() || '미분류';
    if (!m[g]) { m[g] = []; order.push(g); }
    m[g].push({ b: b, idx: idx });
  });
  order.sort((a, x) => {
    if (a === '미분류') return 1;
    if (x === '미분류') return -1;
    return a.localeCompare(x, 'ko');
  });
  return order.map(name => ({
    name: name,
    items: m[name].sort((p, q) => (p.b.sort || 0) - (q.b.sort || 0) || p.b.title.localeCompare(q.b.title, 'ko'))
  }));
}

function orderCtl(g, i) {
  const w = el('div', 'ord');
  const up = el('button', '', '▲');
  const dn = el('button', '', '▼');
  up.title = '위로'; dn.title = '아래로';
  up.disabled = i === 0;
  dn.disabled = i === g.items.length - 1;
  const move = async (delta) => {
    const arr = g.items.slice();
    const t = arr[i]; arr[i] = arr[i + delta]; arr[i + delta] = t;
    arr.forEach((it, n) => { it.b.sort = (n + 1) * 10; });
    renderBooks();
    try {
      await srv('adminSetBookOrder', TOKEN,
        arr.map((it, n) => ({ title: it.b.title, group: g.name, sort: (n + 1) * 10 })));
    } catch (e) {
      alert('순서 저장 실패: ' + ((e && e.message) || e) +
        '\n\n시트 메뉴 [⑧ v2.0 그룹·순서 준비]를 먼저 실행해 주세요.');
    }
  };
  up.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); move(-1); };
  dn.onclick = (ev) => { ev.preventDefault(); ev.stopPropagation(); move(1); };
  w.appendChild(up); w.appendChild(dn);
  return w;
}

  }

function stepSelect(p, mark) {
  const sel = document.createElement('select');
  STEP_NAMES.forEach((nm, i) => {
    const o = document.createElement('option');
    o.value = String(i + 1); o.textContent = (i + 1) + '단계 · ' + nm;
    sel.appendChild(o);
  });
  sel.value = String(p.step);
  sel.onchange = async () => {
    sel.disabled = true; markBusy(mark);
    try {
      const res = await srv('adminSetStep', TOKEN, p.pid, parseInt(sel.value, 10), p.title);
      p.step = res.step;

}

function checkChips(p) {
  const w = el('div', 'cks');
  p.checks.forEach(c => {
    const chip = el('span', 'ckc');
    const paint = () => {
      chip.textContent = (c.done ? '✓ ' : '') + c.label.replace(/\s*\(.*\)$/, '');
      let cls = 'ckc ';
      if (c.done) cls += 'on';
      else if (c.due) {
        const dn = dday(c.due);
        cls += (dn !== null && dn < 0) ? 'off od' : 'off';
        const sm = document.createElement('small');
        sm.textContent = c.due + (dn === null ? '' : (dn < 0 ? ' 지남' : (dn === 0 ? ' 오늘' : ' D-' + dn)));
        chip.appendChild(sm);
      } else {
        cls += 'mid';
        const sm = document.createElement('small');
        sm.textContent = '기한 미정';
        chip.appendChild(sm);
      }
      chip.className = cls;
    };
    paint();
    chip.onclick = async () => {
      if (chip.classList.contains('busy')) return;
      chip.classList.add('busy');
      const want = !c.done;
      try {
        await srv('adminSetCheck', TOKEN, p.pid, c.key, want, p.title);
        c.done = want;
        p.pendingCnt = p.checks.filter(x => !x.done).length;
        paint();
        renderBadges();
      } catch (e) { alert('저장 실패: ' + (e.message || e)); }
      chip.classList.remove('busy');
    };
    w.appendChild(chip);
  });
  return w;
}

/** 도서 관리 탭 — 접었다 펴는 도서 카드 (요약줄 + 펼치면 전체 관리 화면) */

function gotoBookCard(title) {
  openState['bk:' + title] = true;

    document.querySelectorAll('details.bookfold').forEach(x => {
      if (x.dataset.book === title) { x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); }

}

function bookFold(b, idx, ordCtl) {
  const d = document.createElement('details');
  d.className = 'bookfold';
  d.dataset.book = b.title;
  d.id = 'bk-' + idx;
  const key = 'bk:' + b.title;
  d.open = !!openState[key];

  const all = issuesFor(b.title);
  const wait = all.filter(i => stateOf(i) === 'wait').length;

  const smy = document.createElement('summary');

  r.appendChild(bookTitleEl(b.pub, b.title));
  if (b.abbr) r.appendChild(el('span', 'chip gray', b.abbr));
  /* v2.6 — 러닝타임을 제목 바로 옆에 항상 표시 (캐스팅 입력과 무관) */
  if (b.rt) r.appendChild(el('span', 'chip rtc', 'RT ' + b.rt));

  }

  if (wait) r.appendChild(el('span', 'pill p-wait', '판정 ' + wait));

/** 기본 오디오 플레이어 + 실패 시 드라이브 미리보기 폴백 (v1.9.1) */
/* v2.4 — 재생 안정화.
   기존에는 다운로드 URL 하나만 써서 느리거나 실패하는 일이 잦았고, 폴백 iframe이 132px이라
   컨트롤이 잘려 보였습니다. 이제 설정!B10의 Drive API 키가 있으면 정식 스트리밍 주소를 먼저 쓰고,
   순서대로 폴백하며, 마지막 iframe은 잘리지 않는 높이로 띄웁니다. */
function audioSrcs(fid) {
  const u = [];
  if (DATA.apiKey) u.push('https://www.googleapis.com/drive/v3/files/' + fid + '?alt=media&key=' + encodeURIComponent(DATA.apiKey));
  u.push('https://drive.usercontent.google.com/download?id=' + fid + '&export=download&confirm=t');
  return u;
}

function dlLink(fid, label) {
  const a = document.createElement('a');
  a.className = 'linkbtn'; a.style.marginTop = '8px';
  a.href = 'https://drive.google.com/file/d/' + fid + '/view';
  a.target = '_blank'; a.rel = 'noopener';
  a.textContent = label || '새 탭에서 듣기 ↗';
  return a;
}

function inlineAudio(fid) {
  const w = el('div');
  const a = document.createElement('audio');
  a.controls = true; a.preload = 'metadata';
  a.style.cssText = 'width:100%;margin-top:6px;display:block;';
  const srcs = audioSrcs(fid);
  let ix = 0;
  a.src = srcs[0];
  a.onerror = () => {
    ix++;
    if (ix < srcs.length) { a.src = srcs[ix]; try { a.load(); } catch (e) {} return; }
    a.remove();
    const fr = document.createElement('iframe');
    fr.className = 'finframe'; fr.allow = 'autoplay';
    fr.style.height = '400px';
    fr.src = 'https://drive.google.com/file/d/' + fid + '/preview';
    w.appendChild(fr);
    w.appendChild(el('div', 'meta', '드라이브 플레이어로 표시 중입니다. 재생이 안 되면 [새 탭에서 듣기]로 열어 주세요. 방금 올린 파일은 구글이 처리 중이라 몇 분 뒤부터 재생되기도 합니다.'));
  };
  w.appendChild(a);
  w.appendChild(dlLink(fid));
  return w;
}

function audioListBlock(label, p, folderUrl, emptyMsg) {
  const w = el('div');
  w.style.marginBottom = '12px';
  w.appendChild(el('div', 'fldlab', label));
  const files = (p && p.mode === 'folder') ? (p.files || []) :
                (p && p.mode === 'file') ? [{ id: p.id, name: p.name }] : [];
  if (!files.length) {
    w.appendChild(el('div', 'meta', p && p.mode === 'none' && !folderUrl
      ? '폴더가 아직 없습니다 — 시트 메뉴 [② 도서 폴더 준비]를 실행해 주세요.' : emptyMsg));
  } else {
    files.forEach((f, idx) => {
      const row = el('div');
      row.style.cssText = 'padding:6px 0;border-bottom:1px solid #eee;';
      const btn = el('button', 'small', '▶ ' + (idx + 1) + '. ' + f.name);
      btn.style.maxWidth = '100%';
      btn.style.overflow = 'hidden';
      btn.style.textOverflow = 'ellipsis';
      btn.onclick = () => {
        const ex = row.querySelector('.aud');
        if (ex) { ex.remove(); return; }
        w.querySelectorAll('.aud').forEach(x => x.remove()); // 한 번에 하나만 재생
        const holder = inlineAudio(f.id);
        holder.className = 'aud';
        row.appendChild(holder);
      };
      row.appendChild(btn);
      w.appendChild(row);
    });
  }
  if (folderUrl) {
    const a = document.createElement('a');
    a.className = 'linkbtn'; a.href = folderUrl; a.target = '_blank';
    a.style.marginTop = '6px'; a.textContent = '폴더 열기';
    w.appendChild(a);
  }
  return w;
}

/* ══════════════════ 수정·검수 (기존 판정 화면 이관) ══════════════════ */
const QUICK = ['그냥 진행', '홈 재녹음', '스튜디오 녹음', '엔지니어 수정', '수정 불가'];
const openState = {};
const FLASH = {};

/* v2.7 — 페이지·파일명·시간을 진한 칩으로 (흐린 회색 → 한눈에 보이게) */
function locLine(i) {
  const parts = [];
  if (i.page) parts.push(['📖', i.page]);
  if (i.file) parts.push(['📄', i.file]);
  if (i.time) parts.push(['⏱', i.time]);
  if (!parts.length) return null;
  const w = el('div', 'locline');
  parts.forEach(p => {
    const c = el('span', 'locchip');
    c.appendChild(el('span', 'ic', p[0]));
    c.appendChild(document.createTextNode(p[1]));
    w.appendChild(c);
  });
  return w;
}

function whoOf(i) {
  const k = i.authorKind || '엔지니어';
  if (k === '출판사') return 'pub';
  if (k === '검수자') return 'rev';
  if (k === '관리자') return 'adm';
  return 'eng';
}

function matchFilter(i) {
  if (S.fBook !== '*' && i.book !== S.fBook) return false;
  if (S.fWho !== 'all' && whoOf(i) !== S.fWho) return false; // v2.4 작성자 필터
  if (S.f === 'all') return true;
  if (S.f === 'up') return isArrived(i);
  return stateOf(i) === S.f;
}

function renderQc() {
  const box = document.getElementById('tab-qc');
  box.innerHTML = '';
  box.appendChild(el('h2', 'sec', '수정·검수'));

  const n = counts();
  const st = el('div', 'stats');
  [['총 이슈', n.total, ''], ['판정 대기 — 내 승인 필요', n.wait, n.wait ? 'warn' : '']].forEach(it => {
    const s = el('div', 'stat' + (it[2] ? ' ' + it[2] : ''));
    s.appendChild(el('b', null, String(it[1])));
    s.appendChild(el('span', null, it[0]));
    st.appendChild(s);
  });
  box.appendChild(st);

  const fb = el('div', 'fbar');
  const tabs = [['wait', '판정 대기'], ['all', '전체']];
  if (S.f === 'up') tabs.splice(1, 0, ['up', '도착·반영 대기']);
  if (S.f === 'prog') tabs.splice(1, 0, ['prog', '진행 중']);
  tabs.forEach(f => {
    const b = el('button', 'f' + (S.f === f[0] ? ' on' : ''), f[1]);
    b.onclick = () => { S.f = f[0]; renderQc(); };
    fb.appendChild(b);
  });
  const bs = document.createElement('select');
  const b0 = document.createElement('option'); b0.value = '*'; b0.textContent = '모든 도서'; bs.appendChild(b0);
  DATA.books.forEach(b => {
    const cntB = issuesFor(b.title).length;
    const o = document.createElement('option');
    o.value = b.title; o.textContent = b.title + (cntB ? ' (' + cntB + ')' : '');
    bs.appendChild(o);
  });
  bs.value = S.fBook;
  bs.onchange = () => { S.fBook = bs.value; renderQc(); };
  fb.appendChild(bs);
  box.appendChild(fb);

  /* v2.4 — 누가 쓴 기록인지로 걸러 보기 */
  const wb = el('div', 'fbar');
  wb.style.marginTop = '2px';
  [['all', '작성자 전체'], ['eng', '엔지니어'], ['rev', '검수자'], ['pub', '출판사'], ['adm', '대표(직접 기록)']].forEach(k => {
    const cntW = k[0] === 'all' ? DATA.issues.length : DATA.issues.filter(x => whoOf(x) === k[0]).length;
    if (!cntW && k[0] !== 'all') return;
    const b2 = el('button', 'f' + (S.fWho === k[0] ? ' on' : ''), k[1] + ' ' + cntW);
    b2.onclick = () => { S.fWho = k[0]; renderQc(); };
    wb.appendChild(b2);
  });
  box.appendChild(wb);

  let shown = 0;
  DATA.books.forEach(b => {
    if (S.fBook !== '*' && b.title !== S.fBook) return;
    const all = issuesFor(b.title);
    const list = all.filter(matchFilter);
    if (S.f !== 'all' && !list.length) return;
    if (S.fBook === '*' && !all.length) return;
    shown++;
    box.appendChild(qcBookGroup(b, all, list));
  });
  if (!shown) box.appendChild(el('div', 'empty', '해당하는 항목이 없습니다.'));

  const nt = el('p', 'note');
  nt.textContent = '판정 안내: 홈 재녹음 → 성우 페이지 즉시 노출 (⑤ 알림 문구로 카톡 발송) · 엔지니어 수정 → 담당자 [작업 대기] 표시 + 메일 · 메모를 적고 판정하면 담당자 화면에 함께 전달 · 수정 불가/그냥 진행 → 출판사에는 "별도 안내"로만 표시.';
  box.appendChild(nt);
}

/* v2.7 — 도서별 대표 검수 카드.
   검수자 화면과 같은 구성: 위에 오디오 플레이어 + 원고 보기, 아래에 오류 기록 양식.
   모든 도서 카드마다 하나씩 붙습니다. */
function reviewFold(b) {
  const d = document.createElement('details');
  d.className = 'fold';
  const key = 'rev:' + b.title;
  d.open = !!openState[key];
  d.addEventListener('toggle', () => { openState[key] = d.open; });
  const smy = document.createElement('summary');
  smy.textContent = '🎧 대표 검수 — 들으면서 오류 기록하기';
  d.appendChild(smy);
  const fin = el('div', 'fin');
  d.appendChild(fin);

  let built = false;
  d.addEventListener('toggle', () => {
    if (!d.open || built) return;
    built = true;

    /* ① 상단: 원고 보기 + 플레이어 */
    const top = el('div', 'btns');
    const msb = el('button', 'small', '📄 원고');
    msb.onclick = () => toggleMs(b.title, msb);
    top.appendChild(msb);
    fin.appendChild(top);

    const player = el('div');
    player.appendChild(el('div', 'meta', '검수용 음원(05 폴더) 불러오는 중…'));
    fin.appendChild(player);
    srv('listBookAudio', TOKEN, b.title, 'qa').then(p => {
      player.innerHTML = '';
      const files = (p && p.mode === 'folder') ? (p.files || []) :
                    (p && p.mode === 'file') ? [{ id: p.id, name: p.name }] : [];
      if (!files.length) {
        player.appendChild(el('div', 'meta', '05_(내부검수용) 폴더에 아직 파일이 없습니다.'));
        return;
      }
      const sel = document.createElement('select');
      sel.style.cssText = 'width:100%;margin:8px 0;padding:10px;font-size:13px;border:1px solid #dfe3e8;border-radius:9px;font-family:inherit';
      files.forEach((f, ix) => {
        const o = document.createElement('option'); o.value = f.id; o.textContent = (ix + 1) + '. ' + f.name;
        sel.appendChild(o);
      });
      const slot = el('div');
      const setTrk = () => {
        slot.innerHTML = '';
        slot.appendChild(inlineAudio(sel.value));
        const f = files.filter(x => x.id === sel.value)[0];
        if (f) fFile.value = f.name.replace(/\.[a-z0-9]+$/i, '');
      };
      sel.onchange = setTrk;
      player.appendChild(sel); player.appendChild(slot);
      setTrk();
    }).catch(e => {
      player.innerHTML = '';
      player.appendChild(el('div', 'meta', '음원을 불러오지 못했습니다: ' + (e.message || e)));
    });

    /* ② 하단: 오류 기록 양식 */
    fin.appendChild(el('div', 'fldlab', '오류 기록 — 작성자는 「대표」로 저장됩니다'));
    const row = el('div', 'frow');
    const stSel = document.createElement('select');
    ['내부검수', '편집', '출판사검수'].forEach(v => {
      const o = document.createElement('option'); o.value = v; o.textContent = v; stSel.appendChild(o);
    });
    const tySel = document.createElement('select');
    (DATA.types || ['오독', '누락', '잡음', '기타']).forEach(v => {
      const o = document.createElement('option'); o.value = v; o.textContent = v; tySel.appendChild(o);
    });
    const fFile = document.createElement('input'); fFile.placeholder = '파일명(챕터)'; fFile.style.width = '150px';
    const fPage = document.createElement('input'); fPage.placeholder = '페이지'; fPage.style.width = '80px'; fPage.inputMode = 'numeric';
    const fTime = document.createElement('input'); fTime.placeholder = '시간 (예 12:07)'; fTime.style.width = '110px';
    [stSel, tySel, fFile, fPage, fTime].forEach(x => row.appendChild(x));
    fin.appendChild(row);

    const fLine = document.createElement('textarea');
    fLine.placeholder = '대사 / 오류 내용';
    fLine.style.cssText = 'width:100%;min-height:66px;margin-top:8px;padding:10px;border:1px solid #dfe3e8;border-radius:9px;font-family:inherit;font-size:13px';
    fin.appendChild(fLine);

    const bt = el('div', 'btns');
    const sv = el('button', 'primary', '등록');
    const mk2 = el('span', 'savemark', '');
    sv.onclick = async () => {
      if (!fLine.value.trim()) { markBad(mk2, { message: '내용을 입력해 주세요' }); return; }
      sv.disabled = true; markBusy(mk2);
      try {
        const r = await srv('adminCreateIssue', TOKEN, {
          book: b.title, stage: stSel.value, type: tySel.value,
          file: fFile.value.trim(), page: fPage.value.trim(), time: fTime.value.trim(),
          line: fLine.value.trim()
        });
        DATA.issues.unshift(r.issue);
        fLine.value = ''; fPage.value = ''; fTime.value = '';
        markOk(mk2, '등록됨 ✓');
        const cnt = fin.querySelector('.revcnt');
        if (cnt) cnt.textContent = '이 도서 기록 ' + issuesFor(b.title).length + '건';
      } catch (e) { markBad(mk2, e); }
      sv.disabled = false;
    };
    bt.appendChild(sv); bt.appendChild(mk2);
    const cnt = el('span', 'meta revcnt', '이 도서 기록 ' + issuesFor(b.title).length + '건');
    bt.appendChild(cnt);
    fin.appendChild(bt);
  });
  return d;
}

function qcBookGroup(b, all, list) {
  const d = document.createElement('details');
  d.className = 'grp';
  const key = b.title;
  const wait = all.filter(i => stateOf(i) === 'wait').length;
  const up = all.filter(isArrived).length;
  d.open = (key in openState) ? openState[key] : (S.f === 'wait' ? wait > 0 : wait + up > 0);
  d.addEventListener('toggle', () => { openState[key] = d.open; });

  const s = document.createElement('summary');
  const r = el('div', 'sumrow');
  r.appendChild(el('span', 'tt', '『' + b.title + '』'));
  if (b.eng) r.appendChild(el('span', 'pill p-eng', b.eng));
  const msb = el('button', 'small', '📄 원고');
  msb.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); toggleMs(b.title, msb); };
  r.appendChild(msb);
  /* v2.6 — 이 도서의 도서 관리 카드로 바로 이동 */
  const gob = el('button', 'small', '도서 관리 →');
  gob.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); gotoBookCard(b.title); };
  r.appendChild(gob);
  if (wait) r.appendChild(el('span', 'pill p-wait', '판정 대기 ' + wait));
  if (up) r.appendChild(el('span', 'pill p-up', '도착 ' + up));
  if (!wait && !up && all.length) r.appendChild(el('span', 'pill p-done', '이슈 ' + all.length + '건 정리됨'));
  if (!all.length) r.appendChild(el('span', 'pill', '이슈 없음'));
  s.appendChild(r);
  d.appendChild(s);

  const inner = el('div', 'ginner');
  if (!list.length) inner.appendChild(el('div', 'empty', S.f === 'all' ? '기록된 이슈가 없습니다.' : '이 필터에 해당하는 이슈가 없습니다.'));
  else {
    const order = { wait: 0, prog: 1, done: 2 };
    const sorted = list.slice().sort((a, x) => (order[stateOf(a)] - order[stateOf(x)]));
    /* v3.1 — 한 번에 15장씩만: 한 도서에 수십 건이 쌓여도 화면이 통째로 길어지지 않게 */
    const BATCH = 15;
    let shownN = 0;
    const moreB = el('button', 'small', '');
    moreB.style.cssText = 'display:block;width:100%;margin-top:10px;';
    const addBatch = () => {
      sorted.slice(shownN, shownN + BATCH).forEach(i => inner.insertBefore(issueCard(i), moreB));
      shownN = Math.min(shownN + BATCH, sorted.length);
      if (shownN >= sorted.length) moreB.remove();
      else moreB.textContent = '더 보기 — 남은 ' + (sorted.length - shownN) + '건';
    };
    moreB.onclick = addBatch;
    inner.appendChild(moreB);
    addBatch();
  }
  d.appendChild(inner);
  return d;
}

function issueStatus(i) {
  if (i.applied === '반영완료') return { cls: 'done', label: '반영 처리됨' };
  /* v3.1 — 도착 시각을 상태 배지에 합쳐 별도 중복 칩을 없앴습니다 */
  if (isArrived(i)) return { cls: 'up', label: '수정 녹음 도착' + (i.upTime ? ' · ' + i.upTime : '') };
  if (i.recstat === '요청됨') return { cls: 'req', label: '재녹음 진행 중' };
  const st = stateOf(i);
  if (st === 'wait') return { cls: 'wait', label: '판정 대기' };
  if (st === 'done') return { cls: 'done', label: '판정: ' + (i.verdict || '') + ' · 종결' };
  return { cls: 'req', label: '판정: ' + (i.verdict || '') };
}

function issueCard(i) {
  const c = el('div', 'item');
  const st8 = issueStatus(i);
  c.classList.add('st-' + st8.cls);
  const r = el('div', 'row');
  r.appendChild(el('span', 'stbadge sb-' + st8.cls, st8.label));
  r.appendChild(el('span', 'idb', i.id));
  /* v2.4 — 누가 쓴 기록인지 항상 표시 */
  const wk = whoOf(i);
  r.appendChild(el('span', 'who w-' + wk,
    i.authorLabel || (wk === 'pub' ? '출판사' : wk === 'rev' ? '검수자' : '엔지니어')));
  if (i.stage === '출판사검수') r.appendChild(el('span', 'pill p-pub', '출판사 피드백'));
  else if (i.stage === '내부검수') r.appendChild(el('span', 'pill p-int', '내부검수'));
  if (i.type) r.appendChild(el('span', 'pill p-type', i.type));
  /* v3.1 — 상태 중복 칩 제거: 예전에는 왼쪽 상태 배지와 같은 내용(판정 대기·도착 등)의
     pill이 한 줄에 두 번 찍혔습니다. 상태는 왼쪽 배지 하나로만 표시합니다. */
  c.appendChild(r);

  const sn = i.line || i.err;
  if (sn) c.appendChild(el('div', 'snippet', sn));
  const ll = locLine(i);
  if (ll) c.appendChild(ll);
  const noteClean = String(i.note || '').split('\n').filter(l => l.indexOf('[대표 메모]') !== 0).join(' · ');
  const meta = [i.character && ('캐릭터 ' + i.character),
    i.role && (i.role + ' · ' + i.actor), noteClean].filter(Boolean).join(' · ');
  if (meta) c.appendChild(el('div', 'meta', meta));
  const am = adminMemoOf(i);
  if (am) c.appendChild(el('div', 'adminmemo', '💬 담당자에게 전달된 메모: ' + am));
  /* v2.4 — 엔지니어가 수정 완료를 보고했으면 확인 클립과 함께 표시 */
  if (i.fixAt) {
    const fx = el('div', 'fixnote');
    fx.appendChild(el('b', null, '✔ 엔지니어 수정 완료 보고 · ' + i.fixAt));
    c.appendChild(fx);
    if (i.fixUrl) {
      const fid2 = String(i.fixUrl).match(/[-\w]{25,}/);
      if (fid2) {
        const fb2 = el('div', 'btns');
        const pb2 = el('button', null, '▶ 수정 확인 클립 듣기 (앞뒤 맥락)');
        pb2.onclick = () => {
          const ex = c.querySelector('.fixwrap');
          if (ex) { ex.remove(); return; }
          const w2 = el('div', 'fixwrap');
          w2.appendChild(inlineAudio(fid2[0]));
          c.insertBefore(w2, msg);
        };
        fb2.appendChild(pb2);
        c.appendChild(fb2);
      }
    }
  }

  const msg = el('div', 'msg', '');
  if (FLASH[i.id]) {
    msg.className = 'msg ok';
    msg.textContent = FLASH[i.id];
    delete FLASH[i.id];
  }

  const play = el('div', 'btns');
  if (i.hasRef) {
    play.appendChild(audioBtn(c, msg, i, 'ref', '▶ 클립 듣기'));
    if (i.refUrl && i.refUrl.indexOf('http') === 0) play.appendChild(openLink(i.refUrl, '열기'));
  }
  if (i.hasUp) {
    play.appendChild(audioBtn(c, msg, i, 'up', '▶ 수정 녹음 듣기'));
    if (i.upUrl && i.upUrl.indexOf('http') === 0) play.appendChild(openLink(i.upUrl, '열기'));
  }
  if (!i.hasRef && finalRefByBook[i.book]) {
    play.appendChild(finalBtn(c, msg, i, finalRefByBook[i.book]));
  }
  if (play.children.length) c.appendChild(play);

  const vb = el('div', 'btns');
  QUICK.forEach(v => {
    const btn = el('button', 'v' + (i.verdict === v ? ' sel' : ''), v);
    btn.onclick = () => setVerdict(i, v, c, msg);
    vb.appendChild(btn);
  });
  const more = document.createElement('select');
  const mo = document.createElement('option'); mo.value = ''; mo.textContent = '그 외…'; more.appendChild(mo);
  DATA.verdicts.filter(v => QUICK.indexOf(v) < 0).forEach(v => {
    const o = document.createElement('option'); o.value = v; o.textContent = v + (i.verdict === v ? ' ✓' : ''); more.appendChild(o);
  });
  more.onchange = () => { if (more.value) { setVerdict(i, more.value, c, msg); more.value = ''; } };
  vb.appendChild(more);

  const memoBtn = el('button', 'small', am ? '메모 ✎' : '메모');
  vb.appendChild(memoBtn);

  if (i.applied !== '반영완료' && (i.recstat === '업로드완료' || i.verdict === '엔지니어 수정')) {
    const done = el('button', 'done', '반영완료 처리');
    done.onclick = async () => {
      done.disabled = true; done.textContent = '처리 중…';
      try {
        await srv('adminMarkApplied', TOKEN, i.id);
        i.applied = '반영완료';
        if (i.recstat === '업로드완료') i.recstat = '반영완료';
        FLASH[i.id] = i.id + ' 반영완료 처리됨';
        renderBadges(); renderQc();
      } catch (e) { done.disabled = false; done.textContent = '반영완료 처리'; msg.className = 'msg bad'; msg.textContent = e.message || String(e); }
    };
    vb.appendChild(done);
  }

  /* v3.1 — 이미 종결된 건은 판정 버튼 줄을 접어 둡니다 (필요하면 [판정 변경]으로 열기).
     전체 보기에서 처리 끝난 카드마다 버튼 7개가 반복되던 소음을 없앱니다. */
  if (st8.cls === 'done') {
    vb.style.display = 'none';
    const tg = el('button', 'small', '판정 변경 · 메모 열기');
    tg.style.marginTop = '9px';
    tg.onclick = () => {
      const hidden = vb.style.display === 'none';
      vb.style.display = hidden ? '' : 'none';
      tg.textContent = hidden ? '판정 버튼 접기' : '판정 변경 · 메모 열기';
    };
    c.appendChild(tg);
  }
  c.appendChild(vb);

  /* 담당자 메모 — 판정과 함께 저장되거나 [메모만 전달]로 즉시 발송 */
  const mb = el('div', 'memobox');
  mb.style.display = 'none';
  const ta = document.createElement('textarea');
  ta.className = 'memoTa';
  ta.placeholder = '엔지니어에게 전달할 메모 — 판정 버튼을 누르면 함께 저장됩니다. 판정 없이 보내려면 아래 [메모만 전달].';
  ta.value = am;
  mb.appendChild(ta);
  const mrow = el('div', 'btns');
  const sendB = el('button', 'small', '메모만 전달 (화면+메일)');
  sendB.onclick = async () => {
    sendB.disabled = true; sendB.textContent = '전달 중…';
    try {
      const res = await srv('adminSendIssueMemo', TOKEN, i.id, ta.value.trim());
      setLocalAdminMemo(i, res.memo);

/* 클립 없는 항목(내부검수·출판사 피드백): 완성본 파일에서 해당 시간으로 이동해 듣기 */
function parseTc(t) {
  const m = String(t || '').trim().match(/^(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?$/);
  if (!m) return null;
  return m[3] !== undefined
    ? (+m[1]) * 3600 + (+m[2]) * 60 + (+m[3])
    : (+m[1]) * 60 + (+m[2]);
}
const qaFilesCache = {};
async function qaFilesOf(book) {
  if (qaFilesCache[book]) return qaFilesCache[book];
  const p = await srv('listBookAudio', TOKEN, book, 'qa');
  const files = (p && p.mode === 'folder') ? (p.files || []) :
                (p && p.mode === 'file') ? [{ id: p.id, name: p.name }] : [];
  return (qaFilesCache[book] = files);
}
function matchAudioFile(files, fname) {
  const f = String(fname || '').trim().toLowerCase();
  if (!f || !files.length) return null;
  const base = f.replace(/\.[a-z0-9]+$/, '');
  return files.find(x => x.name.toLowerCase() === f)
      || files.find(x => base && x.name.toLowerCase().indexOf(base) >= 0)
      || files.find(x => { const nb = x.name.toLowerCase().replace(/\.[a-z0-9]+$/, ''); return nb && f.indexOf(nb) >= 0; })
      || null;
}
function playSeekInto(w, fid, sec) {
  const holder = inlineAudio(fid);
  const au = holder.querySelector('audio');
  if (au && sec !== null) {
    au.addEventListener('loadedmetadata', () => { try { au.currentTime = sec; } catch (e) {} }, { once: true });
    w.appendChild(el('div', 'meta', '재생하면 기록된 시간 지점부터 시작합니다. (파일이 크면 준비에 몇 초 걸립니다)'));
  }
  w.appendChild(holder);
}
function finalBtn(card, msg, i, fr) {
  const label = '▶ 완성본에서 듣기' + (i.time ? ' (' + i.time + ')' : '');
  const b = el('button', null, label);
  b.onclick = async () => {
    const ex = card.querySelector('.finwrap');
    if (ex) { ex.remove(); b.textContent = label; return; }
    const w = el('div', 'finwrap');
    const sec = parseTc(i.time);
    if (i.time || i.file) w.appendChild(el('div', 'tcbig', (i.time ? '위치 ' + i.time : '') + (i.file ? (i.time ? ' · ' : '') + i.file : '')));
    card.insertBefore(w, msg);
    b.textContent = '완성본 닫기';
    if (fr.id) { playSeekInto(w, fr.id, sec); return; }
    /* v2.3 — 완성본이 폴더(챕터 파일들)인 경우: 기록된 파일명으로 자동 매칭해 그 파일을 해당 위치에서 재생 */
    const ld = el('div', 'meta', '완성본 파일 찾는 중…');
    w.appendChild(ld);

        w.appendChild(openLink(fr.url, '완성본 폴더 열기'));
        w.appendChild(el('div', 'meta', '05 폴더에 오디오 파일이 없습니다 — 폴더를 확인해 주세요.'));
        return;
      }
      const hit = matchAudioFile(files, i.file) || (files.length === 1 ? files[0] : null);
      if (hit) {
        if (!i.file) w.appendChild(el('div', 'meta', '파일: ' + hit.name));
        playSeekInto(w, hit.id, sec);
      } else {
        w.appendChild(el('div', 'meta', '기록된 파일명과 일치하는 파일을 찾지 못했습니다 — 아래에서 선택해 주세요.'));
        files.forEach(f => {
          const fb = el('button', 'small', '▶ ' + f.name);
          fb.style.cssText = 'display:block;margin:5px 0 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;';
          fb.onclick = () => {
            w.querySelectorAll('.aud2').forEach(x => x.remove());
            const hw = el('div', 'aud2');
            w.appendChild(hw);
            playSeekInto(hw, f.id, sec);
          };
          w.appendChild(fb);
        });
      }
    } catch (e) { ld.textContent = '목록을 불러오지 못했습니다: ' + (e.message || e); }

  return b;
}

/* ══════════════════ 녹음 기록 (페이 정산) ══════════════════ */
function parseDur(str) {
  const t = String(str || '').trim();
  let m = t.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);
  if (m) return (+m[1]) * 60 + (+m[2]) + (m[3] ? (+m[3]) / 60 : 0);
  m = t.match(/^(?:(\d+(?:\.\d+)?)\s*시간)?\s*(?:(\d+)\s*분)?$/);
  if (m && (m[1] || m[2])) return (m[1] ? parseFloat(m[1]) * 60 : 0) + (m[2] ? +m[2] : 0);
  return null;
}
function fmtDur(min) {
  const h = Math.floor(min / 60), mm = Math.round(min % 60);
  return h + ':' + String(mm).padStart(2, '0');
}

      return v.actor + ' · ' + v.method + ' 합계 ' + (v.min ? fmtDur(v.min) : '—') + (v.bad ? ' (일부 해석 불가)' : '') + ' · ' + v.cnt + '건';
    }).join('   |   ');
    c.appendChild(el('div', 'castsum', sline));

    const tw = el('div', 'rtblwrap');
    const tbl = document.createElement('table'); tbl.className = 'rtbl';
    const thead = document.createElement('thead');
    const htr = document.createElement('tr');
    [['날짜', 64], ['성우', 70], ['방식', 0], ['수치', 90], ['비고', 0], ['', 52]].forEach(hh => {
      const th = document.createElement('th');
      th.textContent = hh[0];
      if (hh[1]) th.style.width = hh[1] + 'px';
      htr.appendChild(th);
    });
    thead.appendChild(htr); tbl.appendChild(thead);
    const tb = document.createElement('tbody');
    byB[bt].forEach(r => {
      const tr = document.createElement('tr');
      const mkc = t => { const td = document.createElement('td'); td.textContent = t || ''; return td; };
      tr.appendChild(mkc(r.date)); tr.appendChild(mkc(r.actor)); tr.appendChild(mkc(r.method));
      tr.appendChild(mkc(r.amount)); tr.appendChild(mkc(r.note));
      const td = document.createElement('td');
      const db = el('button', 'small', '삭제');
      db.onclick = async () => {
        if (!confirm(r.date + ' · ' + r.actor + ' · ' + r.amount + ' 기록을 삭제할까요?')) return;
        db.disabled = true;
        try { await srv('adminDelRecLog', TOKEN, r.id); DATA.recLog = DATA.recLog.filter(x => x.id !== r.id); renderRec(); }
        catch (e) { db.disabled = false; alert('삭제 실패: ' + (e.message || e)); }
      };
      td.appendChild(db); tr.appendChild(td);
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); tw.appendChild(tbl); c.appendChild(tw);
    box.appendChild(c);
  });
}

/* ══════════════════ v2.3: 원고 패널 (좌 PDF · 우 작업) ══════════════════ */
const msCache = {};
const MS = { open: false, book: '' };
document.getElementById('msClose').onclick = () => closeMs();
function closeMs() {
  MS.open = false; MS.book = '';
  document.body.classList.remove('msopen');
  document.getElementById('msFrame').src = 'about:blank';
  document.querySelectorAll('button.small').forEach(x => { if (x.textContent === '📄 원고 닫기') x.textContent = '📄 원고'; });
}
async function toggleMs(book, btn) {
  if (MS.open && MS.book === book) { closeMs(); return; }
  const orig = '📄 원고';
  if (btn) { btn.disabled = true; btn.textContent = '원고 여는 중…'; }
  try {
    const res = msCache[book] || (msCache[book] = await srv('getScriptPdf', TOKEN, book));
    if (!res.found) {
      delete msCache[book];
      if (btn) { btn.textContent = '원고 PDF 없음 (01 폴더)'; setTimeout(() => { btn.textContent = orig; }, 2200); btn.disabled = false; }
      return;
    }
    document.getElementById('msName').textContent = '『' + book + '』 ' + res.name + (res.locked ? ' · 다운로드 제한됨' : '');
    document.getElementById('msFrame').src = 'https://drive.google.com/file/d/' + res.id + '/preview';
    if (MS.open) closeMs();
    MS.open = true; MS.book = book;
    document.body.classList.add('msopen');
    if (btn) btn.textContent = '📄 원고 닫기';
  } catch (e) {
    if (btn) { btn.textContent = '실패: ' + (e.message || e); setTimeout(() => { btn.textContent = orig; }, 2600); }
  }
  if (btn) btn.disabled = false;
}

/* ══════════════════ v2.3: 출결 (급여 기간 26일~25일) ══════════════════ */
let attAnchor = new Date();
function attPeriod(anchor) {
  const y = anchor.getFullYear(), m = anchor.getMonth(), d = anchor.getDate();
  let ey = y, em = m;
  if (d > 25) { em = m + 1; if (em > 11) { em = 0; ey++; } }
  const end = new Date(ey, em, 25);
  const start = new Date(ey, em - 1, 26);
  return { start: start, end: end };
}
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const md = d => (d.getMonth() + 1) + '/' + d.getDate();
const WD = ['일', '월', '화', '수', '목', '금', '토'];
function fmtH(min) { return (Math.round(min / 6) / 10) + 'h'; }

function renderAtt() {
  const box = document.getElementById('tab-att');
  box.innerHTML = '';
  const A = DATA.attendance || { rows: [], hourly: {} };
  const p = attPeriod(attAnchor);
  box.appendChild(el('h2', 'sec', '출결 — 내부인력 근무 기록'));

  const bar = el('div', 'fbar');
  const prev = el('button', 'f', '◀ 이전 기간');
  prev.onclick = () => { attAnchor = new Date(p.start.getFullYear(), p.start.getMonth(), 25); renderAtt(); };
  const lab = el('button', 'f on', md(p.start) + ' ~ ' + md(p.end) + ' · 급여 기간');
  lab.disabled = true;
  const next = el('button', 'f', '다음 기간 ▶');
  next.onclick = () => { attAnchor = new Date(p.end.getTime() + 86400000 * 2); renderAtt(); };
  bar.appendChild(prev); bar.appendChild(lab); bar.appendChild(next);
  box.appendChild(bar);
  box.appendChild(el('p', 'greet', '엔지니어·검수자가 각자 개인 페이지 [출결 기록]에서 입력한 내용이 여기 모입니다. 급여 기간: 전월 26일 ~ 당월 25일. 엔지니어 탭 H열에 시급을 입력하면 예상 금액이 함께 표시됩니다.'));

  const s0 = ymd(p.start), e0 = ymd(p.end);
  const rows = (A.rows || []).filter(r => r.date >= s0 && r.date <= e0);
  if (!rows.length) { box.appendChild(el('div', 'empty', '이 기간의 출결 기록이 아직 없습니다.')); return; }

  const byName = {};
  rows.forEach(r => { (byName[r.name] = byName[r.name] || []).push(r); });
  const tmin = rows.reduce((a, r) => a + r.min, 0);
  const st = el('div', 'stats');
  const s1 = el('div', 'stat'); s1.appendChild(el('b', null, String(Object.keys(byName).length))); s1.appendChild(el('span', null, '근무 인원'));
  const s2 = el('div', 'stat'); s2.appendChild(el('b', null, fmtH(tmin))); s2.appendChild(el('span', null, '합계 근무'));
  st.appendChild(s1); st.appendChild(s2);
  box.appendChild(st);

  const days = [];
  for (let d = new Date(p.start); d <= p.end; d = new Date(d.getTime() + 86400000)) days.push(new Date(d));

  Object.keys(byName).sort((a, b) => a.localeCompare(b, 'ko')).forEach(nm => {
    const list = byName[nm];
    const min = list.reduce((a, r) => a + r.min, 0);
    const rate = (A.hourly || {})[nm];
    const c = el('div', 'card');
    const hd = el('div', 'bhead');
    hd.appendChild(el('span', 'tt', nm));
    if (list[0].kind) hd.appendChild(el('span', 'chip gray', list[0].kind));
    hd.appendChild(el('span', 'pill p-done', '합계 ' + fmtH(min) + ' · ' + list.length + '일'));
    if (rate) hd.appendChild(el('span', 'pill p-up', '예상 ≈ ' + Math.round(min / 60 * rate).toLocaleString('ko-KR') + '원 (시급 ' + rate.toLocaleString('ko-KR') + ')'));
    c.appendChild(hd);

    const byDate = {};
    list.forEach(r => byDate[r.date] = r);
    const bars = el('div', 'attbars');
    bars.style.gridTemplateColumns = 'repeat(' + days.length + ',1fr)';
    const lbls = el('div', 'attbars');
    lbls.style.gridTemplateColumns = 'repeat(' + days.length + ',1fr)';
    lbls.style.marginTop = '0';
    days.forEach(d => {
      const r = byDate[ymd(d)];
      const bd = el('div', 'attbar' + (r ? ' on' : ''));
      bd.style.height = (r ? Math.min(64, 8 + r.min / 480 * 52) : 5) + 'px';
      bd.title = md(d) + '(' + WD[d.getDay()] + ')' + (r ? ' · ' + r.start + '~' + r.end + ' · ' + fmtH(r.min) : ' · 기록 없음');
      bars.appendChild(bd);
      const lb = el('div', 'attlbl', (d.getDate() === 1 || d.getDate() === 26 || d.getDay() === 1) ? String(d.getDate()) : '');
      if (d.getDay() === 0) lb.style.color = '#d8574a';
      lbls.appendChild(lb);
    });
    c.appendChild(bars); c.appendChild(lbls);

    const tw = el('div', 'rtblwrap');
    const tbl = document.createElement('table'); tbl.className = 'rtbl';
    const thead = document.createElement('thead'); const htr = document.createElement('tr');
    ['날짜', '요일', '시작~종료', '휴게', '근무', '메모'].forEach(t => { const th = document.createElement('th'); th.textContent = t; htr.appendChild(th); });
    thead.appendChild(htr); tbl.appendChild(thead);
    const tb = document.createElement('tbody');
    list.slice().sort((a, b2) => a.date.localeCompare(b2.date)).forEach(r => {
      const tr = document.createElement('tr');
      const dt = new Date(r.date + 'T00:00:00');
      [md(dt), WD[dt.getDay()], r.start + ' ~ ' + r.end, r.brk ? r.brk + '분' : '—', fmtH(r.min), r.memo || ''].forEach(t => {
        const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); tw.appendChild(tbl); c.appendChild(tw);
    box.appendChild(c);
  });

  renderWorkSection(box); // v2.4 — 외주 작업 집계
}

/* v2.4 — 프리랜서가 자기 화면에서 등록한 외주 작업 조건을 한눈에 모아 봅니다 */
function renderWorkSection(box) {
  const W = DATA.work || [];
  box.appendChild(el('h2', 'sec', '외주 작업 — 담당자가 등록한 도서별 작업 조건'));
  if (!W.length) {
    box.appendChild(el('div', 'empty', '아직 등록된 작업이 없습니다. 엔지니어·검수자 페이지 [출결 및 작업 현황]에서 등록합니다.'));
    return;
  }
  const won2 = n => (n || 0).toLocaleString('ko-KR');
  const byName = {};
  W.forEach(r => { (byName[r.name] = byName[r.name] || []).push(r); });

  const tot = el('div', 'stats');
  [['등록 도서', W.length + '건', ''],
   ['진행 중', W.filter(r => r.status !== '완료').length + '건', ''],
   ['단가 합계', won2(W.reduce((a, r) => a + (r.fee || 0), 0)) + '원', '']].forEach(it => {
    const sx = el('div', 'stat');
    sx.appendChild(el('b', null, it[1]));
    sx.appendChild(el('span', null, it[0]));
    tot.appendChild(sx);
  });
  box.appendChild(tot);

  Object.keys(byName).sort((a, b) => a.localeCompare(b, 'ko')).forEach(nm => {
    const list = byName[nm];
    const c = el('div', 'card');
    const hd = el('div', 'bhead');
    hd.appendChild(el('span', 'tt', nm));
    if (list[0].kind) hd.appendChild(el('span', 'chip gray', list[0].kind));
    hd.appendChild(el('span', 'pill p-done', list.length + '권 · ' + won2(list.reduce((a, r) => a + (r.fee || 0), 0)) + '원'));
    c.appendChild(hd);

    const tw = el('div', 'rtblwrap');
    const tbl = document.createElement('table'); tbl.className = 'rtbl';
    const thead = document.createElement('thead'); const htr = document.createElement('tr');
    ['출판사', '도서명', '러닝타임', '단가', '상태', '메모'].forEach(t => {
      const th = document.createElement('th'); th.textContent = t; htr.appendChild(th);
    });
    thead.appendChild(htr); tbl.appendChild(thead);
    const tb = document.createElement('tbody');
    list.slice().sort((a, b) => a.book.localeCompare(b.book, 'ko')).forEach(r => {
      const tr = document.createElement('tr');
      [r.pub || '—', r.book, r.rt || '—',
       r.fee ? won2(r.fee) + '원' : '—', r.status || '—', r.memo || ''].forEach(t => {
        const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    tbl.appendChild(tb); tw.appendChild(tbl); c.appendChild(tw);
    box.appendChild(c);
  });
}

/* ── 시작 ── */
/* v2.5 — 관리자 잠금. 설정!B11에 비밀번호가 있으면 먼저 확인 화면을 띄웁니다.
   같은 탭에서는 한 번만 물어보고, 탭을 닫으면 다시 물어봅니다(공용 PC 대비). */
function boot() { prepData(); go('home'); }

function lockScreen() {
  /* v2.6 — 흰 화면 버그 수정.
     예전에는 body를 비우고 성공 시 location.reload()를 했는데, Apps Script 웹앱은
     샌드박스 iframe 안에서 실행되어 reload가 빈 화면으로 끝나는 경우가 있었습니다.
     이제 앱 화면 위에 잠금 "덮개"만 씌우고, 성공하면 덮개를 걷고 그 자리에서 바로 부팅합니다. */
  const wrap = el('div');
  wrap.id = 'lockOverlay';
  wrap.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f5f7';
  const box = el('div');
  box.style.cssText = 'background:#fff;border:1px solid #e3e6ea;border-radius:16px;padding:32px 28px;max-width:380px;width:100%;box-shadow:0 2px 14px rgba(0,0,0,.06)';
  const h = el('div', null, '관리자 대시보드');
  h.style.cssText = 'font-size:18px;font-weight:800;color:#16283c;margin-bottom:6px';
  const p = el('div', null, '대표 전용 화면입니다. 비밀번호를 입력해 주세요.');
  p.style.cssText = 'font-size:13px;color:#7c8792;line-height:1.6;margin-bottom:18px';
  const inp = document.createElement('input');
  inp.type = 'password'; inp.autocomplete = 'current-password'; inp.placeholder = '비밀번호';
  inp.style.cssText = 'width:100%;padding:13px;font-size:15px;border:1px solid #d7dbe0;border-radius:10px;font-family:inherit;outline:none';
  inp.onfocus = () => { inp.style.borderColor = '#1f3b57'; };
  const btn = el('button', null, '들어가기');
  btn.style.cssText = 'width:100%;margin-top:12px;padding:13px;background:#1f3b57;color:#fff;border:0;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit';
  const msg = el('div');
  msg.style.cssText = 'margin-top:11px;font-size:13px;text-align:center;line-height:1.6;min-height:18px';
  const tryIt = async () => {
    const pin = inp.value.trim();
    if (!pin) { msg.style.color = '#b23a2f'; msg.textContent = '비밀번호를 입력해 주세요.'; return; }
    btn.disabled = true; btn.textContent = '확인 중…';
    msg.style.color = '#7c8792'; msg.textContent = '';
    try {
      const full = await srv('adminUnlock', TOKEN, pin);
      try { sessionStorage.setItem('sp_admin_ok', pin); } catch (e) {}
      DATA = full;
      wrap.remove();               /* 덮개를 걷고 */
      document.body.style.overflow = '';
      boot();                      /* 그 자리에서 바로 시작 — 새로고침 불필요 */
    } catch (e) {
      msg.style.color = '#b23a2f'; msg.textContent = (e && e.message) || '확인에 실패했습니다.';
      btn.disabled = false; btn.textContent = '들어가기';
      inp.value = ''; inp.focus();
    }
  };
  btn.onclick = tryIt;
  inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') tryIt(); });
  [h, p, inp, btn, msg].forEach(x => box.appendChild(x));
  wrap.appendChild(box);
  document.body.style.overflow = 'hidden';
  document.body.appendChild(wrap);
  inp.focus();
}

async function start() {
  if (!DATA.gate) { boot(); return; }
  let saved = '';
  try { saved = sessionStorage.getItem('sp_admin_ok') || ''; } catch (e) {}
  if (saved) {
    try {
      DATA = await srv('adminUnlock', TOKEN, saved);
      boot();
      return;
    } catch (e) {
      try { sessionStorage.removeItem('sp_admin_ok'); } catch (e2) {}
    }
  }
  lockScreen();
}
start();
</script>
